<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Maison Forfè</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,Roboto,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.32,1.45,.52,1);
  --r-xl:26px;--r-lg:20px;--r-md:14px;
  --safe-top:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --safe-bot:max(env(safe-area-inset-bottom,0px),calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)));
}
html[data-theme="light"]{
  --bg:#F6F1E9;--surface:#FFFFFF;--surface2:#EEE6D9;--surface3:#E6DCCB;
  --ink:#221F1B;--ink2:#5E574D;--muted:#8C8375;--hair:rgba(34,31,27,.08);
  --accent:#A5803F;--accent-press:#8F6D33;--on-accent:#FFFFFF;--accent-soft:rgba(165,128,63,.13);
  --gold:#A5803F;--tile:#F3EDE3;--blend:multiply;--photo-filter:none;
  --glass:rgba(255,253,249,.72);--glass-line:rgba(255,255,255,.7);
  --shadow:0 10px 30px rgba(78,62,38,.10);--shadow-nav:0 12px 36px rgba(78,62,38,.18);
  --cta-glow:0 10px 26px rgba(165,128,63,.34);
  --ok:#3E7B4F;--ok-soft:rgba(62,123,79,.12);--bad:#B4453A;
  --scrim:rgba(34,31,27,.32);--icon-filter:none;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0C111C;--surface:#151C2B;--surface2:#1E2738;--surface3:#273248;
  --ink:#EDF0F7;--ink2:#B8C0D2;--muted:#8A93A8;--hair:rgba(237,240,247,.08);
  --accent:#86A6E3;--accent-press:#6F90D2;--on-accent:#0C111C;--accent-soft:rgba(134,166,227,.15);
  --gold:#C9A35E;--tile:#EEF1F6;--blend:multiply;--photo-filter:none;
  --glass:rgba(21,28,43,.72);--glass-line:rgba(255,255,255,.07);
  --shadow:0 10px 30px rgba(0,0,0,.35);--shadow-nav:0 14px 40px rgba(0,0,0,.55);
  --cta-glow:0 10px 28px rgba(134,166,227,.30);
  --ok:#6FC08A;--ok-soft:rgba(111,192,138,.14);--bad:#F08A80;
  --scrim:rgba(4,7,14,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background .35s var(--ease),color .35s var(--ease)}
body{overscroll-behavior-y:none}
body.locked{overflow:hidden}
button{font-family:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
input,textarea{font-family:inherit}
::-webkit-scrollbar{display:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
svg.ci{width:18px;height:18px;flex:0 0 auto}
.press{transition:transform .32s var(--spring),background .25s,opacity .25s}
.press:active{transform:scale(.94)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(110px + var(--safe-bot))}

/* top bar */
.top{position:sticky;top:0;z-index:30;padding:calc(var(--safe-top) + 10px) 18px 10px;transition:background .3s,box-shadow .3s,backdrop-filter .3s}
.top.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 1px 0 var(--hair)}
.top-row{display:flex;align-items:center;gap:10px;min-height:44px}
.title{flex:1;min-width:0;font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .sub{display:block;font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:3px}
.rbtn{width:42px;height:42px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 var(--hair) inset,0 0 0 1px var(--hair);flex:0 0 auto}
.rbtn .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.rbtn{position:relative}
.search{margin-top:12px;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{width:100%;height:46px;border-radius:15px;border:none;outline:none;background:var(--surface);color:var(--ink);font-size:16px;padding:0 40px 0 42px;box-shadow:0 0 0 1px var(--hair);transition:box-shadow .2s}
.search input:focus{box-shadow:0 0 0 2px var(--accent)}
.search input::placeholder{color:var(--muted)}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--muted)}
.search.has .clr{display:flex}

/* hero gift */
.hero{margin:6px 18px 0;border-radius:var(--r-xl);background:var(--surface2);padding:16px 16px 16px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);pointer-events:none}
.hero-ic{width:52px;height:52px;border-radius:16px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:0 0 auto}
.hero-ic svg{width:26px;height:26px}
.hero-b{flex:1;min-width:0}
.hero-k{font-size:12.5px;color:var(--muted)}
.hero-t{font-size:17px;font-weight:700;letter-spacing:-.3px;margin:2px 0 9px}
.bar{height:6px;border-radius:9px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent);transition:width .7s var(--ease)}
.hero-s{font-size:12px;color:var(--ink2);margin-top:7px}

/* auction */
.auc{background:var(--surface);border-radius:26px;padding:14px;box-shadow:0 0 0 1px var(--hair)}
.auc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill.live i{animation:live 2s infinite}
.auc-end{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.auc-ph{margin-top:12px;aspect-ratio:4/3;border-radius:20px;background:var(--tile);position:relative;overflow:hidden;cursor:pointer}
.auc-ph img{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;mix-blend-mode:var(--blend)}
.auc-name{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:14px;line-height:1.15}
.auc-meta{font-size:13.5px;color:var(--muted);margin-top:4px}
.auc-price{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.auc-price b{font-size:38px;font-weight:700;letter-spacing:-1.3px;font-variant-numeric:tabular-nums;line-height:1}
.auc-price b.drop{animation:dropf .9s var(--ease)}
@keyframes dropf{0%{color:var(--accent);transform:translateY(-6px)}100%{color:var(--ink);transform:none}}
.auc-price span{font-size:15px;color:var(--muted);font-weight:500}
.auc-bar{height:8px;margin-top:12px;background:var(--surface2)}
.auc-lim{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px}
.auc-bar i{transition:width 1s linear}
.auc-next[hidden]{display:none}
.auc-disc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.auc-disc b{font-size:13px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:4px 9px;border-radius:999px}
.auc-disc s{text-decoration-thickness:1px}
.auc-alert{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:12px;font-size:14px;font-weight:600;color:var(--accent);padding:6px}
.auc-alert svg{width:17px;height:17px}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips2 button{height:34px;padding:0 13px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600}
.auc-next span{display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:600}
.auc-next{display:flex;justify-content:space-between;align-items:center;margin:14px 0 0;padding:12px 14px;border-radius:16px;background:var(--surface2);font-size:13.5px;color:var(--ink2)}
.auc-next b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.auc .btn+.btn{margin-top:8px}
.auc .btn.wait{background:var(--surface2);color:var(--ink2);box-shadow:none}
.auc-count{font-size:44px;font-weight:700;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.1}
.auc-h{font-size:17px;font-weight:600;margin-top:14px}
.auc-prev{display:flex;gap:12px;align-items:center;text-align:left;margin-top:18px;padding:10px;border-radius:18px;background:var(--surface2)}
.auc-prev .thumb{width:56px;height:56px}
.auc-sold{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.auc-sold .thumb{width:52px;height:52px}
.nav .ldot{position:absolute;top:7px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--surface);animation:live 2s infinite}
.ad-lot{padding:14px;border-radius:18px;background:var(--surface2);margin-bottom:10px}
.ad-lot .t{font-weight:700;font-size:15px}
.ad-lot .m{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.ad-tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface);margin-left:6px;vertical-align:1px}
.ad-off{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 0;margin-top:10px;border-top:1px solid var(--hair);font-size:13px}
.ad-off .btns{display:flex;gap:6px}
.ad-off .btns button{height:32px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface)}
.ad-off .btns button.yes{background:var(--ok-soft);color:var(--ok)}
.ad-res{max-height:220px;overflow-y:auto;margin-top:8px;border-radius:14px;background:var(--surface2)}
.ad-res button{display:flex;width:100%;justify-content:space-between;gap:8px;padding:11px 14px;font-size:14px;text-align:left;border-bottom:1px solid var(--hair)}
.ad-res button span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.ad-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select.inp{appearance:none;-webkit-appearance:none}

/* recent orders feed */
.feed{padding:4px 0 2px}
.feed-h{display:flex;align-items:center;gap:7px;margin:8px 20px 8px;font-size:13px;color:var(--muted);font-weight:500}
.feed-h .live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.feed-row{display:flex;gap:8px;overflow-x:auto;padding:0 18px 6px;scroll-padding-inline:18px;scroll-snap-type:x proximity}
.fd{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:18px;text-align:left;scroll-snap-align:start;background:var(--lg-fill,var(--surface));-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--hair),inset 0 1px 0 var(--lg-rim,transparent);max-width:230px}
.fd.new{animation:rise .6s var(--ease) both}
.fd-ph{width:46px;height:46px;border-radius:13px;background:var(--tile);overflow:hidden;position:relative;flex:0 0 auto}
.fd-ph img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;mix-blend-mode:var(--blend)}
.fd b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;letter-spacing:-.15px}
.fd small{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
html.lite .fd{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 18px 6px;scroll-padding-inline:18px}
.chip{flex:0 0 auto;height:38px;display:flex;align-items:center;gap:7px;padding:0 14px;border-radius:999px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;box-shadow:0 0 0 1px var(--hair);white-space:nowrap;scroll-snap-align:start;transition:background .25s,color .25s,transform .32s var(--spring)}
.chip:active{transform:scale(.94)}
.chip .n{font-size:12px;color:var(--muted);font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip.on .n{color:var(--bg);opacity:.6}
.chip.icon{width:38px;padding:0;justify-content:center;position:relative}
.chip.icon .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.meta-row{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 2px;font-size:13px;color:var(--muted)}
.meta-row button{color:var(--accent);font-weight:600;font-size:13px}

/* grid + cards */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:10px 14px 0}
.card{border-radius:24px;padding:8px 8px 9px}
.card .tile{border-radius:18px}
.card .c-name{font-size:15.5px;margin:11px 4px 0;line-height:1.25}
.card .c-meta{font-size:12.5px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:7px 7px 10px;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--hair)}
.card.enter{animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tile{position:relative;aspect-ratio:1/1;border-radius:15px;background:var(--tile);overflow:hidden;cursor:pointer}
.tile img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;mix-blend-mode:var(--blend);opacity:0;transition:opacity .45s var(--ease),transform .6s var(--ease)}
.tile img.ok{opacity:1}
.tile:active img{transform:scale(.96)}
.tile .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9A9285}
.tile .ph svg{width:40px;height:40px;opacity:.5}
.shimmer{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:220% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
.fav{position:absolute;top:7px;right:7px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#6E675C;transition:transform .35s var(--spring),color .2s}
.fav svg{width:17px;height:17px}
.fav.on{color:#C0563F}
.fav.on svg{fill:currentColor}
.fav.pop{animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.c-name{font-size:14px;font-weight:600;line-height:1.28;letter-spacing:-.15px;margin:10px 4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.c-meta{font-size:12px;color:var(--muted);margin:3px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-foot{display:flex;flex-direction:column;gap:10px;margin:auto 0 0;padding-top:10px}
.c-price{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;margin:0 4px;font-size:16.5px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
.c-price span{font-size:12.5px;font-weight:600;color:var(--ink2);letter-spacing:0}
.c-price small{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.cbtn{width:100%;height:44px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.cbtn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 55%);pointer-events:none}
.cbtn svg{width:17px;height:17px}
.cstep{width:100%;height:44px;border-radius:999px;background:var(--accent-soft);display:flex;align-items:center;justify-content:space-between;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent)}
.cstep button{width:46px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.cstep button svg{width:18px;height:18px;stroke-width:2.3}
.cstep span{font-size:14px;font-weight:700;color:var(--ink)}
.add{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.add svg{width:18px;height:18px;stroke-width:2.2}
.step{display:flex;align-items:center;height:34px;border-radius:999px;background:var(--accent-soft);color:var(--ink);animation:grow .35s var(--spring)}
@keyframes grow{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.step button{width:30px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.step button svg{width:16px;height:16px;stroke-width:2.2}
.step span{min-width:16px;text-align:center;font-size:14px;font-weight:700}
.skel{background:var(--surface);border-radius:var(--r-lg);padding:7px;box-shadow:0 0 0 1px var(--hair)}
.skel .t{aspect-ratio:1/1;border-radius:15px;background:var(--surface2);position:relative;overflow:hidden}
.skel .l{height:12px;border-radius:6px;background:var(--surface2);margin:12px 4px 0;width:80%}
.skel .l.s{width:50%;margin-top:8px}
.sentinel{height:1px}
.more{display:flex;justify-content:center;padding:18px}
.more button{height:44px;padding:0 24px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--hair);font-weight:600;font-size:14px}

/* empty */
.empty{text-align:center;padding:56px 32px 20px}
.empty .ic{width:76px;height:76px;border-radius:24px;background:var(--surface2);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.empty .ic svg{width:34px;height:34px;stroke-width:1.5}
.empty h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.4px}
.empty p{margin:8px auto 0;color:var(--muted);font-size:14.5px;line-height:1.45;max-width:280px}
.empty .btn{margin-top:22px}

/* lists */
.pad{padding:6px 18px 0}
.group{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--hair);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:88px;right:0;height:1px;background:var(--hair)}
.thumb{width:66px;height:66px;border-radius:14px;background:var(--tile);overflow:hidden;position:relative;flex:0 0 auto;cursor:pointer}
.thumb img{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;mix-blend-mode:var(--blend)}
.row .b{flex:1;min-width:0}
.row .n{font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .p{font-size:14.5px;font-weight:700;margin-top:6px;letter-spacing:-.2px}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.x{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface2)}
.x svg{width:15px;height:15px}
.sec-t{font-size:20px;font-weight:700;letter-spacing:-.4px;margin:26px 2px 10px}
.card2{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--hair);padding:16px}
.card2+.card2{margin-top:12px}

/* cert block in cart */
.cert{display:flex;gap:13px;align-items:center}
.cert .ic{width:46px;height:46px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:0 0 auto}
.cert .t{font-size:15px;font-weight:600}
.cert .s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.toggle{width:51px;height:31px;border-radius:999px;background:var(--surface3);position:relative;flex:0 0 auto;transition:background .25s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .35s var(--spring)}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}
.sum-row{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink2);padding:5px 0}
.sum-row.disc{color:var(--ok)}
.sum-row.tot{color:var(--ink);font-size:19px;font-weight:700;letter-spacing:-.4px;padding-top:12px;margin-top:8px;border-top:1px solid var(--hair)}

/* form */
.fld{margin-bottom:14px}
.fld label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:0 4px 6px;font-weight:500}
.fld label em{font-style:normal;opacity:.8}
.inp{width:100%;min-height:48px;border-radius:14px;border:none;outline:none;background:var(--surface2);color:var(--ink);font-size:16px;padding:13px 14px;box-shadow:0 0 0 1px transparent;transition:box-shadow .2s,background .2s;resize:none}
.inp:focus{box-shadow:0 0 0 2px var(--accent);background:var(--surface)}
.inp.bad{box-shadow:0 0 0 2px var(--bad)}
.inp::placeholder{color:var(--muted)}
.err{color:var(--bad);font-size:12.5px;margin:6px 4px 0}
.inline{display:flex;gap:8px}
.inline .inp{flex:1}
.tgbtn{flex:0 0 auto;height:48px;padding:0 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.tgbtn svg{width:17px;height:17px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);line-height:1.45;padding:2px 4px}
.note svg{color:var(--gold);width:18px;height:18px;margin-top:1px}

/* buttons */
.btn{height:54px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:16.5px;font-weight:650;font-weight:600;letter-spacing:-.2px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 26px;box-shadow:var(--cta-glow);transition:transform .32s var(--spring),background .2s,box-shadow .2s}
.btn:active{transform:scale(.96);background:var(--accent-press)}
.btn.full{width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none}
.btn.sm{height:42px;font-size:14.5px;padding:0 18px}
.btn[disabled]{opacity:.6}
.link{color:var(--accent);font-weight:600;font-size:14.5px}
.dock{position:fixed;left:0;right:0;bottom:calc(84px + var(--safe-bot));z-index:35;padding:0 18px;pointer-events:none;display:flex;justify-content:center}
.dock .btn{pointer-events:auto;width:100%;max-width:524px}
.dock .btn .amt{opacity:.75;font-weight:600}

/* nav */
.nav{position:fixed;left:50%;bottom:calc(14px + var(--safe-bot));transform:translateX(-50%);z-index:40;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:var(--shadow-nav),inset 0 0 0 1px var(--glass-line)}
.nav .ind{position:absolute;top:5px;left:5px;height:calc(100% - 10px);border-radius:999px;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.08),inset 0 0 0 1px var(--hair);transition:transform .5s var(--spring),width .5s var(--spring)}
.nav button{position:relative;z-index:1;height:52px;min-width:64px;padding:0 12px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;transition:color .3s}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.nav button.on svg.fillable{fill:currentColor;fill-opacity:.15}
.nav .bdg{position:absolute;top:5px;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.nav .bdg.pop{animation:pop .45s var(--spring)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .3s var(--ease)}
.scrim.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;margin:0 auto;max-width:560px;max-height:calc(100vh - var(--safe-top) - 24px);background:var(--surface);border-radius:30px 30px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .5s var(--ease)}
.sheet.in{transform:none}
.sheet .grab{flex:0 0 auto;padding:10px 0 4px;display:flex;justify-content:center;touch-action:none}
.sheet .grab i{width:38px;height:5px;border-radius:9px;background:var(--surface3)}
.sheet .hd{flex:0 0 auto;display:flex;align-items:center;justify-content:center;position:relative;min-height:46px;padding:0 64px;touch-action:none}
.sheet .hd h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px;text-align:center}
.sheet .close{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.sheet .close svg{width:18px;height:18px;stroke-width:2.2}
.sheet .bd{overflow-y:auto;padding:8px 20px 20px;-webkit-overflow-scrolling:touch}
.sheet .ft{flex:0 0 auto;padding:12px 20px calc(14px + var(--safe-bot));background:linear-gradient(to top,var(--surface) 70%,transparent)}

/* product sheet */
.p-photo{position:relative;border-radius:24px;background:var(--tile);aspect-ratio:4/3;overflow:hidden}
.p-photo img{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;mix-blend-mode:var(--blend)}
.p-photo .fav{top:12px;right:12px;width:40px;height:40px}
.p-photo .fav svg{width:19px;height:19px}
.p-name{font-size:25px;font-weight:700;letter-spacing:-.6px;margin:18px 0 0;line-height:1.15}
.p-sub{font-size:14.5px;color:var(--muted);margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--ok-soft);color:var(--ok)}
.pill.off{background:rgba(180,69,58,.12);color:var(--bad)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.specs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}
.spec{background:var(--surface2);border-radius:16px;padding:11px 12px}
.spec .k{font-size:11.5px;color:var(--muted)}
.spec .v{font-size:14px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badges img{height:52px;width:auto;max-width:100%;object-fit:contain;border-radius:12px;background:#fff;padding:6px 8px}
.p-price{display:flex;align-items:baseline;gap:10px;margin-top:20px}
.p-price b{font-size:26px;font-weight:700;letter-spacing:-.7px}
.p-price span{font-size:14px;color:var(--muted)}
.buybar{display:flex;gap:10px;align-items:center}
.qty{display:flex;align-items:center;height:54px;border-radius:999px;background:var(--surface2);flex:0 0 auto}
.qty button{width:46px;height:54px;display:flex;align-items:center;justify-content:center}
.qty button svg{width:18px;height:18px;stroke-width:2.2}
.qty span{min-width:22px;text-align:center;font-size:17px;font-weight:700}
.buybar .btn{flex:1;padding:0 14px}

/* segmented + filter */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:3px;position:relative}
.seg button{flex:1;height:38px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink2);transition:background .25s,color .25s,box-shadow .25s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08),0 0 0 1px var(--hair)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px;border-radius:16px;background:var(--surface2);font-size:15.5px;font-weight:500;transition:background .2s,box-shadow .2s}
.opt.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt .ck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--surface3);display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.opt.on .ck{background:var(--accent);box-shadow:none}
.opt .ck svg{width:14px;height:14px;stroke-width:3;opacity:0}
.opt.on .ck svg{opacity:1}
.lbl{font-size:13px;color:var(--muted);font-weight:500;margin:4px 4px 10px}

/* profile */
.prof{text-align:center;padding:8px 18px 4px}
.ava{width:92px;height:92px;border-radius:50%;margin:0 auto;background:linear-gradient(145deg,var(--gold),var(--accent));display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#fff;overflow:hidden;box-shadow:0 0 0 4px var(--surface),0 10px 30px rgba(0,0,0,.12)}
.ava img{width:100%;height:100%;object-fit:cover}
.prof h2{margin:14px 0 0;font-size:24px;font-weight:700;letter-spacing:-.5px}
.prof .u{color:var(--muted);font-size:14.5px;margin-top:3px}
.giftcard{position:relative;border-radius:24px;overflow:hidden;padding:18px;color:#FBF6EC;background:#221F1B;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
html[data-theme="dark"] .giftcard{background:#1B2540}
.giftcard::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(201,163,94,.45),transparent 60%),radial-gradient(80% 80% at 0% 100%,rgba(165,128,63,.22),transparent 60%)}
.giftcard>*{position:relative}
.giftcard .k{font-size:12.5px;opacity:.7}
.giftcard .amt{font-size:30px;font-weight:700;letter-spacing:-.8px;margin-top:4px}
.giftcard .f{display:flex;justify-content:space-between;align-items:flex-end;font-size:12.5px;opacity:.85;margin-top:16px}
.giftcard .code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;font-size:13px;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.12)}
.giftcard.used{filter:grayscale(.8);opacity:.75}
.mrow{display:flex;align-items:center;gap:13px;padding:13px 14px;position:relative;width:100%;text-align:left}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--hair)}
.mrow .mi{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--gold);flex:0 0 auto}
.mrow .mi svg{width:19px;height:19px}
.mrow .mt{flex:1;min-width:0;font-size:15.5px;font-weight:500}
.mrow .mt small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.mrow .mv{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:4px}
.mrow .mv svg{width:16px;height:16px}
.steps{display:flex;flex-direction:column;gap:0}
.stp{display:flex;gap:14px;position:relative;padding-bottom:16px}
.stp:last-child{padding-bottom:0}
.stp .n{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative;z-index:1}
.stp:not(:last-child)::before{content:"";position:absolute;left:14.5px;top:30px;bottom:0;width:1px;background:var(--hair)}
.stp .tx{font-size:14.5px;line-height:1.45;padding-top:5px}
.order{padding:14px}
.order+.order{border-top:1px solid var(--hair)}
.order .h{display:flex;justify-content:space-between;align-items:baseline}
.order .no{font-weight:700;font-size:15px}
.order .dt{font-size:12.5px;color:var(--muted)}
.order .its{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.45}
.order .f{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.order .f b{font-size:15px}

/* welcome */
.wel-art{border-radius:26px;overflow:hidden;aspect-ratio:1/1;max-width:240px;margin:6px auto 0;box-shadow:0 18px 40px rgba(0,0,0,.18);animation:float 5s ease-in-out infinite}
.wel-art img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
.center{text-align:center}
.h1{font-size:25px;font-weight:700;letter-spacing:-.6px;margin:22px 0 0;line-height:1.15}
.lead{color:var(--muted);font-size:15px;line-height:1.5;margin:10px auto 0;max-width:330px}
.done-ic{width:84px;height:84px;border-radius:50%;margin:10px auto 0;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;animation:pop .6s var(--spring)}
.done-ic svg{width:40px;height:40px;stroke-width:2.4}
.summary .it{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:7px 0}
.summary .it span:first-child{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary .it span:last-child{font-weight:600;flex:0 0 auto}

/* toast */
.toast{position:fixed;left:50%;top:calc(var(--safe-top) + 12px);z-index:90;transform:translate(-50%,calc(-100% - var(--safe-top) - 40px));display:flex;align-items:center;gap:9px;padding:11px 16px 11px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .5s var(--spring);max-width:calc(100% - 32px);white-space:nowrap}
.toast.in{transform:translate(-50%,0)}
.toast .ti{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.toast .ti svg{width:14px;height:14px;stroke-width:2.6}
.view{display:none}
.view.on{display:block;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== Liquid Glass ===== */
html[data-theme="light"]{
  --lg-fill:rgba(255,255,255,.42);--lg-fill-strong:rgba(255,255,255,.55);
  --lg-rim:rgba(255,255,255,.95);--lg-rim2:rgba(255,255,255,.25);--lg-edge:rgba(120,96,58,.14);
  --lg-shadow:0 8px 28px rgba(78,62,38,.16),0 1px 2px rgba(78,62,38,.08);
  --amb1:rgba(201,163,94,.42);--amb2:rgba(140,160,200,.30);--amb3:rgba(232,190,150,.38);
}
html[data-theme="dark"]{
  --lg-fill:rgba(30,39,56,.38);--lg-fill-strong:rgba(255,255,255,.11);
  --lg-rim:rgba(255,255,255,.38);--lg-rim2:rgba(255,255,255,.06);--lg-edge:rgba(0,0,0,.35);
  --lg-shadow:0 10px 32px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --amb1:rgba(70,110,200,.45);--amb2:rgba(201,163,94,.20);--amb3:rgba(40,70,150,.40);
}
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(60px);animation:drift 22s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:340px;height:340px;top:-110px;right:-90px;background:var(--amb1)}
.ambient i:nth-child(2){width:380px;height:380px;bottom:8%;left:-150px;background:var(--amb2);animation-delay:-8s}
.ambient i:nth-child(3){width:260px;height:260px;top:42%;right:-120px;background:var(--amb3);animation-delay:-14s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-30px,40px) scale(1.12)}}
html,body{background:var(--bg)}
.lg{position:relative;isolation:isolate;background:var(--lg-fill);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.04);backdrop-filter:blur(18px) saturate(190%) brightness(1.04);box-shadow:var(--lg-shadow),inset 0 0 0 .5px var(--lg-edge)}
.lg::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:linear-gradient(150deg,var(--lg-rim) 0%,var(--lg-rim2) 28%,transparent 50%,var(--lg-rim2) 74%,var(--lg-rim) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.28),transparent 55%)}
html[data-theme="dark"] .lg::after{background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.10),transparent 55%)}
/* controls on glass */
.rbtn{box-shadow:none}
.rbtn.lg{background:var(--lg-fill)}
.search input{background:var(--lg-fill);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);box-shadow:var(--lg-shadow),inset 0 0 0 .5px var(--lg-edge),inset 0 1px 0 var(--lg-rim)}
.top.scrolled{background:linear-gradient(to bottom,var(--bg) 0%,color-mix(in srgb,var(--bg) 55%,transparent) 100%);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:none;
  -webkit-mask:linear-gradient(#000 80%,transparent);mask:linear-gradient(#000 80%,transparent);padding-bottom:16px}
.chip:not(.on){background:var(--lg-fill);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--lg-edge),inset 0 1px 0 var(--lg-rim)}
.hero{background:var(--lg-fill-strong);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--lg-shadow),inset 0 0 0 .5px var(--lg-edge),inset 0 1px 0 var(--lg-rim)}
.hero-ic{background:var(--lg-fill-strong);box-shadow:inset 0 1px 0 var(--lg-rim)}
.fav{background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(14px) saturate(200%) brightness(1.08);backdrop-filter:blur(14px) saturate(200%) brightness(1.08);box-shadow:0 2px 10px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 .5px rgba(0,0,0,.08);color:#5E574D}
/* nav */
.nav{background:var(--lg-fill);-webkit-backdrop-filter:blur(14px) saturate(210%) brightness(1.06) contrast(.92);backdrop-filter:blur(14px) saturate(210%) brightness(1.06) contrast(.92);box-shadow:var(--lg-shadow),inset 0 0 0 .5px var(--lg-edge)}
.nav.lg{position:fixed}
.nav .ind{background:var(--lg-fill-strong);box-shadow:0 2px 12px rgba(0,0,0,.10),inset 0 1px 0 var(--lg-rim),inset 0 -1px 0 var(--lg-rim2),inset 0 0 0 .5px var(--lg-edge)}
html[data-theme="dark"] .nav .ind{background:rgba(255,255,255,.13)}
.nav.squish .ind{animation:squish .5s var(--spring)}
@keyframes squish{0%{scale:1 1}35%{scale:1.12 .9}70%{scale:.97 1.04}100%{scale:1 1}}
/* sheets as glass */
.sheet{background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%);box-shadow:0 -20px 60px rgba(0,0,0,.18),inset 0 1px 0 var(--lg-rim)}
.sheet .ft{background:linear-gradient(to top,color-mix(in srgb,var(--surface) 85%,transparent) 60%,transparent)}
.sheet .close{background:var(--lg-fill);box-shadow:inset 0 1px 0 var(--lg-rim),inset 0 0 0 .5px var(--lg-edge)}
.scrim{background:color-mix(in srgb,var(--scrim) 70%,transparent);-webkit-backdrop-filter:blur(4px) saturate(120%);backdrop-filter:blur(4px) saturate(120%)}
/* toast */
.toast{background:color-mix(in srgb,var(--ink) 78%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18)}
/* primary button: tinted glass sheen */
.btn:not(.ghost){position:relative;overflow:hidden}
.btn:not(.ghost)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.08)}
.add{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
/* content cards: slightly translucent so the ambience breathes through */

/* ===== UX и доступность: контраст, фокус, состояния, зоны нажатия, иерархия ===== */
/* контраст: вторичный текст и золотая кнопка дотягивают до WCAG AA (4.5:1) в светлой теме */
html[data-theme="light"]{--muted:#6F675A;--accent:#8A6A32;--accent-press:#745829;--accent-soft:rgba(138,106,50,.13);--focus:#8A6A32}
html[data-theme="dark"]{--focus:#A9C2F0}
.sheet:focus{outline:none}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
h1.title{margin:0}

/* видимый фокус с клавиатуры (Telegram Desktop, внешняя клавиатура) */
:where(button,a,[role="button"],[tabindex]):focus{outline:none}
:where(button,a,[role="button"],[tabindex]):focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.card:focus-within{box-shadow:inset 0 0 0 1.5px var(--focus),var(--shadow-1)}
.ax :focus-visible,.giftcard :focus-visible{outline-color:#fff}
.search input:focus-visible,.inp:focus-visible{outline:none}

/* состояния: наведение (только мышь), нажатие, недоступно, загрузка */
@media (hover:hover) and (pointer:fine){
  .btn:not([disabled]):hover{background:var(--accent-press)}
  .btn.ghost:not([disabled]):hover{background:var(--surface3)}
  .cbtn:hover{background:var(--accent-press)}
  .chip:not(.on):hover{background:var(--surface2)}
  .card{transition:box-shadow .3s var(--ease),transform .45s var(--spring)}
  .card:hover{box-shadow:inset 0 0 0 1px var(--line),var(--shadow-2)}
  .mrow:hover,.opt:not(.on):hover,.ad-res button:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
  .nav button:not(.on):hover{color:var(--ink)}
  .rbtn:hover,.sheet .close:hover,.x:hover{background:var(--surface2)}
  .fav:hover{color:#C0563F}
  .link:hover,.meta-row button:hover{text-decoration:underline;text-underline-offset:3px}
  .c-name:hover{color:var(--accent)}
  .ax-sec button:hover,.ax-sh:hover{background:rgba(255,255,255,.16)}
}
.cbtn:active,.add:active{background:var(--accent-press)}
.btn[disabled],.ax-buy:disabled,.cbtn[disabled]{opacity:.55;box-shadow:none;cursor:not-allowed;transform:none}
.btn.loading{opacity:.85;cursor:progress}
.btn.loading::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* зоны нажатия не меньше 40–44 px, не меняя внешний вид */
.fav{width:36px;height:36px}
.x{width:36px;height:36px}
.search .clr{width:40px;height:40px;right:4px}
.step{height:36px}
.step button{width:36px;height:36px}
.add{width:38px;height:38px}
.chip{height:40px}
.chip.icon{width:40px}
.fav::after,.x::after,.add::after,.step button::after,.ax-bell::after{content:"";position:absolute;inset:-6px}
.x,.add,.step button,.ax-bell{position:relative}
.meta-row button{min-height:40px;padding:0 4px}
#welLater{min-height:44px}

/* галерея фото в карточке товара */
.gal{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gal-s{flex:0 0 100%;height:100%;position:relative;scroll-snap-align:center;scroll-snap-stop:always;cursor:zoom-in;border-radius:0}
.gal-s img{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;mix-blend-mode:var(--blend)}
.gal-s:focus-visible{outline-offset:-4px}
.gal-zoom{position:absolute;left:12px;bottom:12px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);color:#5E574D;box-shadow:0 1px 3px rgba(0,0,0,.08);pointer-events:none}
.gal-zoom svg{width:17px;height:17px}
.gal-dots{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.75);pointer-events:none}
.gal-dots i{width:6px;height:6px;border-radius:3px;background:rgba(34,31,27,.28);transition:width .3s var(--ease),background .3s}
.gal-dots i.on{width:16px;background:#221F1B}
.gal-n{position:absolute;right:12px;bottom:12px;height:28px;padding:0 10px;border-radius:999px;display:flex;align-items:center;background:rgba(255,255,255,.9);color:#221F1B;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none}
.tile .npho{position:absolute;left:8px;bottom:8px;height:22px;padding:0 8px;border-radius:999px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.88);color:#221F1B;font-size:11.5px;font-weight:600;pointer-events:none}
.tile .npho svg{width:13px;height:13px}
/* просмотр на весь экран: щипок, двойной тап, свайпы, клавиши */
.pv{position:fixed;inset:0;z-index:80;background:#F3EDE3;display:flex;flex-direction:column;opacity:0;transition:opacity .25s var(--ease);touch-action:none}
.pv.in{opacity:1}
.pv-top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 10px) 14px 10px;color:#221F1B;transition:opacity .25s}
.pv-top b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;max-width:60%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);color:#221F1B;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pv-btn svg{width:20px;height:20px;stroke-width:2.2}
.pv-btn:focus-visible{outline:2.5px solid #8A6A32;outline-offset:2px}
.pv-st{position:absolute;inset:0;overflow:hidden}
.pv-st img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transform-origin:50% 50%;will-change:transform;user-select:none;-webkit-user-drag:none}
.pv-st img.anim{transition:transform .3s var(--ease-out),opacity .25s}
.pv-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.pv-nav.p{left:14px}.pv-nav.n{right:14px}
.pv-nav[hidden]{display:none}
.pv-hint{position:absolute;left:50%;bottom:calc(var(--safe-bot) + 18px);transform:translateX(-50%);z-index:2;font-size:12.5px;color:#5E574D;background:rgba(255,255,255,.8);padding:6px 12px;border-radius:999px;white-space:nowrap;transition:opacity .4s}
.pv.zoomed .pv-hint,.pv.zoomed .pv-nav{opacity:0;pointer-events:none}
@media (hover:none){.pv-nav{display:none}}

/* «Поделиться» справа в шапке карточки товара */
.sheet .hd .share{left:auto;right:16px}
.sheet .hd .share svg{width:18px;height:18px;stroke-width:2}

/* статистика владельца */
.st-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.st-t{background:var(--surface2);border-radius:14px;padding:12px;min-width:0}
.st-t span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.st-t b{display:block;font-size:24px;font-weight:700;letter-spacing:-.6px;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.st-t small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:14px 2px 0}
.st-card{margin-top:14px;padding:14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.st-ch-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st-ch-h h3{margin:0;font-size:15px;font-weight:700}
.st-mt{display:flex;padding:3px;border-radius:10px;background:var(--surface2)}
.st-mt button{height:30px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.st-mt button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.st-chart{position:relative;height:170px;margin-top:22px;padding-left:46px}
.st-grid{position:absolute;inset:0 0 18px 46px}
.st-grid span{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.st-grid span:last-child{border-top-color:color-mix(in srgb,var(--ink) 18%,transparent)}
.st-grid i{position:absolute;right:calc(100% + 6px);top:-7px;font-style:normal;font-size:10.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.st-bars{position:absolute;inset:0 0 0 46px;display:flex;gap:2px;align-items:stretch}
.st-b{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:18px;border-radius:6px}
.st-b i{display:block;margin:0 auto;width:min(14px,70%);background:color-mix(in srgb,var(--accent) 55%,transparent);border-radius:4px 4px 0 0;transition:background .2s}
.st-b.on i{background:var(--accent)}
.st-b em{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:10.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.st-b.on em{color:var(--ink);font-weight:700}
@media (hover:hover) and (pointer:fine){.st-b:hover i{background:var(--accent)}}
.st-sel{display:flex;flex-direction:column;gap:2px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.st-sel b{font-size:13.5px;font-weight:600}
.st-sel b::first-letter{text-transform:uppercase}
.st-sel span{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.st-tbl{margin-top:10px}
.st-tbl summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);padding:6px 0;min-height:32px}
.st-tbl table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.st-tbl th,.st-tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-weight:500}
.st-tbl th:first-child,.st-tbl thead th:first-child{text-align:left}
.st-tbl thead th{color:var(--muted);font-weight:600}
.st-list{padding:2px 0}
.st-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px}
.st-row+.st-row{border-top:1px solid var(--line)}
.st-row .thumb{width:44px;height:44px;border-radius:10px}
.st-rt{flex:1;min-width:0}
.st-rt b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-rt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.st-n{font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

/* кнопка перенесена в MainButton Telegram */
.mb-hidden{display:none!important}
.sheet .ft:has(> .mb-hidden:only-child){display:none}

/* похожие товары в карточке */
.sim{margin-top:22px}
.sim-h{font-size:15px;font-weight:700;color:var(--ink);margin:0 2px 10px}
.sim-row{display:flex;gap:10px;overflow-x:auto;margin:0 calc(-1 * var(--gx));padding:2px var(--gx) 6px;scroll-snap-type:x proximity;scroll-padding-inline:var(--gx);overscroll-behavior-x:contain}
.sim-c{flex:0 0 136px;display:flex;flex-direction:column;align-items:stretch;text-align:left;scroll-snap-align:start;padding:6px 6px 10px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.sim-ph{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:12px;background:var(--tile);overflow:hidden;color:#9A9285}
.sim-ph img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;mix-blend-mode:var(--blend)}
.sim-n{font-size:13.5px;font-weight:600;line-height:1.25;margin:8px 4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.sim-m{font-size:11.5px;color:var(--muted);margin:2px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim-p{font-size:14px;font-weight:700;margin:6px 4px 0;letter-spacing:-.2px;white-space:nowrap}
.sim-p small{font-size:11.5px;font-weight:500;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.sim-c:hover{box-shadow:inset 0 0 0 1px var(--line),var(--shadow-2)}.sim-c:hover .sim-n{color:var(--accent)}}

/* очередь заказов и нет сети */
.pill.ost{height:22px;padding:0 8px;font-size:11.5px;vertical-align:2px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.pill.ost.off{background:rgba(180,69,58,.12);color:var(--bad)}
.netbar{position:fixed;left:50%;top:calc(var(--safe-top) + 10px);z-index:85;transform:translate(-50%,-160%);max-width:calc(100% - 32px);padding:9px 14px;border-radius:14px;background:#3A332B;color:#FBF6EC;font-size:13px;font-weight:600;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .45s var(--ease-out);pointer-events:none}
.netbar.in{transform:translate(-50%,0)}

/* сортировка каталога */
.meta-row{gap:8px}
.meta-row>span{min-width:0}
.meta-row #resetAll{min-height:0;padding:6px 2px}
.sortbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 12px!important;border-radius:999px;background:var(--surface);color:var(--ink)!important;font-size:13px!important;font-weight:600;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;flex:none}
.sortbtn svg{width:16px;height:16px}
.sortbtn svg:last-child{width:14px;height:14px;color:var(--muted)}
.sortbtn.on{background:var(--accent-soft);color:var(--accent)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
@media (hover:hover) and (pointer:fine){.sortbtn:hover{background:var(--surface2);text-decoration:none!important}.sortbtn.on:hover{background:var(--accent-soft)}}

/* масштаб: щипок разрешён, двойной тап не зумит, поля ≥16 px — iOS не приближает при вводе */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.search input,.inp,input,textarea,select{font-size:16px}

/* кнопка «Оформить заказ» не закрывает поле, в котором пишут */
#v-cart .inp{scroll-margin:96px 0 calc(170px + var(--safe-bot))}
.dock,.nav{transition:opacity .25s var(--ease),transform .3s var(--ease)}
body.typing .dock,body.typing .nav{opacity:0;pointer-events:none;transform:translateY(16px)}
body.typing .nav{transform:translate(-50%,16px)}
body.typing .dock .btn{pointer-events:none}

/* иерархия */
.c-meta,.card .c-meta{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.sec-t{font-size:18px;font-weight:700;margin:28px 4px 10px}
.p-name{margin-top:18px}
.p-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:8px}
.p-head b{font-size:26px;font-weight:700;letter-spacing:-.7px;font-variant-numeric:tabular-nums}
.p-head span{font-size:14px;color:var(--muted)}
.p-head small{font-size:14px;color:var(--muted);margin-left:auto}
.p-price{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.p-price b{font-variant-numeric:tabular-nums}
.badges img{height:64px}
.fld label{color:var(--ink2);font-weight:600}
.fld .req{color:var(--bad);margin:0 auto 0 3px}
.err{display:flex;gap:5px;align-items:center;font-weight:500}
.err::before{content:"!";flex:none;width:16px;height:16px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.order .dt{color:var(--muted)}

/* ошибка загрузки аукциона */
.state{text-align:center;padding:36px 22px}
.state .ic{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.state .ic svg{width:28px;height:28px}
.state h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.3px}
.state p{margin:6px auto 18px;max-width:290px;color:var(--muted);font-size:14.5px;line-height:1.45}

/* узкие экраны (320–359 px): карточки и кнопки не ломаются */
@media (max-width:359px){
  .grid{gap:8px;padding-left:12px;padding-right:12px}
  .card .c-name{font-size:13.5px}
  .c-price{font-size:15px}
  .c-price small{display:none}
  .cbtn{font-size:13px;gap:5px}
  .cbtn svg{display:none}
  .title{font-size:24px}
  .nav button{min-width:58px;padding:0 8px}
  .specs{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app" id="app">
  <header class="top" id="top">
    <div class="top-row">
      <h1 class="title" id="title"></h1>
      <button class="rbtn lg press" id="themeBtn" aria-label="Тема"></button>
    </div>
    <div class="search" id="searchWrap" role="search">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="text" inputmode="search" autocomplete="off" enterkeyhint="search">
      <button class="clr" id="searchClr" aria-label="Очистить"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>

  <section class="view on" id="v-catalog">
    <div id="feed"></div>
    <div id="hero"></div>
    <div class="chips" id="chips"></div>
    <div class="meta-row" id="metaRow"></div>
    <div class="grid" id="grid"></div>
    <div id="catEmpty"></div>
    <div class="more" id="moreWrap" hidden><button class="press" id="moreBtn"></button></div>
    <div class="sentinel" id="sentinel"></div>
  </section>
  <section class="view" id="v-auction"></section>
  <section class="view" id="v-favs"></section>
  <section class="view" id="v-cart"></section>
  <section class="view" id="v-profile"></section>
</div>

<div class="dock" id="dock" hidden></div>
<nav class="nav lg" id="nav" aria-label="Menu"><div class="ind" id="ind" aria-hidden="true"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"><div class="ti" aria-hidden="true"></div><span></span></div>

<script>
'use strict';
const BASE='uploads/homev-catalog-redesign/';
const ORDER_URL='/api/order';
const MANAGER='irustambekov';
const CERT_AMOUNT=500000, CERT_MIN=3000000;

/* Uzbek Latin -> Cyrillic */
function toCyr(s){
  const ap="['‘’ʻʼ`]";
  const R=[[new RegExp('O'+ap,'g'),'Ў'],[new RegExp('o'+ap,'g'),'ў'],[new RegExp('G'+ap,'g'),'Ғ'],[new RegExp('g'+ap,'g'),'ғ'],
   [/Sh/g,'Ш'],[/SH/g,'Ш'],[/sh/g,'ш'],[/Ch/g,'Ч'],[/CH/g,'Ч'],[/ch/g,'ч'],[/Yo/g,'Ё'],[/yo/g,'ё'],[/Yu/g,'Ю'],[/yu/g,'ю'],[/Ya/g,'Я'],[/ya/g,'я'],[/Ye/g,'Е'],[/ye/g,'е'],
   [/\bE/g,'Э'],[/\be/g,'э'],[new RegExp('([a-zA-Z])'+ap,'g'),'$1ъ']];
  const M={a:'а',b:'б',d:'д',e:'е',f:'ф',g:'г',h:'ҳ',i:'и',j:'ж',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',q:'қ',r:'р',s:'с',t:'т',u:'у',v:'в',x:'х',y:'й',z:'з',c:'с',w:'в'};
  return s.split(/(\{[a-z]+\}|\d[\d\s]*)/).map((part,i)=>{
    if(i%2) return part;
    R.forEach(([re,v])=>part=part.replace(re,v));
    return part.replace(/[a-zA-Z]/g,ch=>{const l=ch.toLowerCase();const c=M[l]||ch;return ch===l?c:c.toUpperCase();});
  }).join('');
}

const CLOUD={favs:'mf_favorites_v1',cart:'mf_cart_v1',orders:'mf_orders_v1_'+UID,lang:'mf_lang',theme:'mf_theme',form:'mf_form_v1',wel:'mf_welcomed_'+UID};

function save(name,v){

function packCloud(name,v,u){

function flushCloud(){
  Object.keys(pendingCloud).forEach(n=>{delete pendingCloud[n];const v=LS.get(CLOUD[n],null),u=LS.get(CLOUD[n]+'__u',Date.now());const s=packCloud(n,v,u);if(s){try{tg.CloudStorage.setItem(n,s,()=>{});}catch(e){}}});

function pullCloud(){return new Promise(res=>{
  if(!cloudOK)return res(false);
  const to=setTimeout(()=>res(false),2500);
  try{tg.CloudStorage.getItems(Object.keys(CLOUD),(err,vals)=>{
    clearTimeout(to);if(err||!vals)return res(false);let changed=false;
    Object.keys(CLOUD).forEach(n=>{
      let c=null;try{c=vals[n]?JSON.parse(vals[n]):null;}catch(e){}
      const local=LS.get(CLOUD[n],null);
      let lu=LS.get(CLOUD[n]+'__u',0);
      // данные, сохранённые до появления синхронизации, считаем локальными изменениями — их нужно выгрузить
      if(!lu&&local!=null&&!(Array.isArray(local)&&!local.length)){lu=1;}
      // заказы и избранное объединяем с разных устройств, чтобы ничего не потерять
      if(c&&local!=null&&(n==='orders'||n==='favs')&&Array.isArray(c.v)&&Array.isArray(local)){
        let merged;
        if(n==='orders'){const m=new Map();[...c.v,...local].forEach(o=>{if(o&&o.no&&!m.has(o.no))m.set(o.no,o);});merged=[...m.values()].sort((a,b)=>(b.date||0)-(a.date||0)).slice(0,30);}
        else merged=c.u>=lu?c.v.slice():[...new Set([...c.v,...local])];
        const same=JSON.stringify(merged)===JSON.stringify(c.v),u=Math.max(c.u||0,lu,Date.now());
        LS.set(CLOUD[n],merged);LS.set(CLOUD[n]+'__u',u);applyCloud(n,merged);changed=true;
        if(!same)pendingCloud[n]=1;
        return;
      }
      if(c&&c.u>lu){LS.set(CLOUD[n],c.v);LS.set(CLOUD[n]+'__u',c.u);applyCloud(n,c.v);changed=true;}
      else if(lu&&(!c||lu>c.u)){if(!LS.get(CLOUD[n]+'__u',0))LS.set(CLOUD[n]+'__u',Date.now());pendingCloud[n]=1;}
    });
    if(Object.keys(pendingCloud).length)flushCloud();
    res(changed);
  });}catch(e){clearTimeout(to);res(false);}
});}

}

/* theme */
function resolvedTheme(){if(S.themePref!=='auto')return S.themePref;if(tg&&tg.colorScheme)return tg.colorScheme;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
function applyTheme(){
  const t=resolvedTheme();document.documentElement.dataset.theme=t;
  const bg=t==='dark'?'#0C111C':'#F6F1E9';
  try{tg&&tg.setHeaderColor&&tg.setHeaderColor(bg);tg&&tg.setBackgroundColor&&tg.setBackgroundColor(bg);tg&&tg.setBottomBarColor&&tg.setBottomBarColor(bg);}catch(e){}
  syncMain();$('themeBtn').innerHTML=ic(t==='dark'?'sun':'moon');$('themeBtn').setAttribute('aria-label',tr('themeA'));
}
/* role="button" на не-кнопках: Enter и пробел работают как нажатие */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;const t=e.target;
  if(t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.tagName!=='BUTTON'){e.preventDefault();t.click();}
});
/* на телефоне, пока открыта клавиатура в форме корзины, прячем меню и кнопку заказа — они не закрывают поле */
(()=>{const touch=matchMedia('(pointer:coarse)');let t;
  const isField=el=>el&&el.closest&&el.closest('#v-cart')&&/^(INPUT|TEXTAREA)$/.test(el.tagName);
  document.addEventListener('focusin',e=>{if(!touch.matches||!isField(e.target))return;clearTimeout(t);document.body.classList.add('typing');
    setTimeout(()=>{try{e.target.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(_){}},300);});
  document.addEventListener('focusout',()=>{clearTimeout(t);t=setTimeout(()=>{if(!isField(document.activeElement))document.body.classList.remove('typing');},120);});
})();

/* ПОХОЖИЕ: «Из этой серии» — тот же рисунок (первое слово названия: Saman, Blue Stone → blue …),
   чтобы докупить к сервизу чайник или пиалы; «Похожие наборы» — тот же тип, ближе по цене и числу предметов */
/* если название начинается с цвета («White Rose», «Pastel Gray»), серия — первые два слова */
const FAM_GENERIC=new Set(['white','pastel','silver','gold','golden','blue','black','rose','pink','gray','grey','green','red','orange','happy','royal','classic']);
const famKey=it=>{const w=((it&&it.name)||'').toLowerCase().split(/\s+/).filter(x=>x&&!/\d/.test(x));if(!w.length)return'';return FAM_GENERIC.has(w[0])&&w[1]?w[0]+' '+w[1]:w[0];};
function similar(it){
  const fam=famKey(it),pool=S.items.filter(x=>x.id!==it.id&&x.in_stock!==false);
  const series=fam.length>=3?pool.filter(x=>famKey(x)===fam)
    .sort((a,b)=>(!a.photo)-(!b.photo)||(a.type===it.type)-(b.type===it.type)||a.price_uzs-b.price_uzs).slice(0,10):[];
  const seen=new Set(series.map(x=>x.id));
  const dist=x=>Math.abs(Math.log((x.price_uzs||1)/(it.price_uzs||1)))+(x.qty&&it.qty?Math.abs(x.qty-it.qty)/Math.max(x.qty,it.qty):.5)+(x.photo?0:2);
  const like=pool.filter(x=>x.type===it.type&&!seen.has(x.id)).map(x=>[x,dist(x)]).sort((a,b)=>a[1]-b[1]).slice(0,10).map(a=>a[0]);
  return{series,like};
}
function simRow(title,list){
  if(!list.length)return'';
  return `<section class="sim" aria-label="${esc(title)}"><div class="lbl sim-h">${esc(title)}</div><div class="sim-row">${list.map(x=>{const p=photo(x);
    return `<button class="sim-c press" data-sim="${esc(x.id)}" aria-label="${esc(x.name+', '+money(x.price_uzs))}"><span class="sim-ph">${p?`<img alt="" loading="lazy" decoding="async" src="${esc(p)}">`:(CAT_ICONS[TYPE_ICON[x.type]]||'')}</span><span class="sim-n">${esc(x.name)}</span><span class="sim-m">${esc(trType(x.type))}</span><b class="sim-p">${num(x.price_uzs)} <small>${esc(tr('sum'))}</small></b></button>`;}).join('')}</div></section>`;
}
function simHtml(it){const {series,like}=similar(it);return simRow(tr('simSeries'),series)+simRow(tr(/набор/i.test(it.type)?'simSets':'simItems'),like);}

/* ПОДЕЛИТЬСЯ ТОВАРОМ
   Ссылка открывает мини-приложение сразу на этом товаре: https://t.me/<бот>?startapp=i_<id>
   (основу ссылки сервер аукциона отдаёт как appLink — из MINIAPP_LINK или имени бота).
   В Telegram — окно выбора чата, в мобильном браузере — системное «Поделиться», иначе — копируем ссылку. */
function productLink(it){
  const app=(AUC.data&&AUC.data.appLink)||LS.get('mf_applink','');
  if(app)return app+(app.includes('?')?'&':'?')+'startapp=i_'+encodeURIComponent(it.id);
  return location.origin+location.pathname+'#i_'+encodeURIComponent(it.id);
}
async function shareProduct(it){
  hap();
  const url=productLink(it),text=tr('shareT',{n:it.name,x:money(it.price_uzs)});
  if(tg&&tg.openTelegramLink&&tg.platform&&tg.platform!=='unknown'&&/^https:\/\/t\.me\//.test(url)){
    try{tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text));return;}catch(e){}
  }
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){
    try{await navigator.share({title:it.name,text,url});return;}catch(e){if(e&&e.name==='AbortError')return;}
  }
  const ok=await copyText(text+'\n'+url);
  if(ok){toast(tr('linkCopied'),'check');return;}
  /* буфер обмена недоступен (так бывает в некоторых окнах Telegram) — показываем ссылку, её можно выделить и скопировать */
  const back=it.id;
  const sh=openSheet({title:tr('shareA'),body:`<p class="lead" style="margin:0 0 12px;text-align:left;max-width:none">${esc(tr('linkManual'))}</p>
    <label class="sr-only" for="shLink">${esc(tr('shareA'))}</label><textarea class="inp" id="shLink" rows="3" readonly>${esc(text+'\n'+url)}</textarea>`,

async function copyText(s){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);return true;}}catch(e){}
  try{const t=document.createElement('textarea');t.value=s;t.setAttribute('readonly','');t.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok;}catch(e){return false;}
}

/* ПРОСМОТР ФОТО НА ВЕСЬ ЭКРАН: щипок и колесо — масштаб, двойной тап — ×2.5, перетаскивание при увеличении,
   свайп влево/вправо — соседнее фото, свайп вниз или Esc — закрыть, стрелки и +/− на клавиатуре */
let PV=null;
function openViewer(list,start,name,onIndex){
  if(PV)PV.close();
  const n=list.length;let i=start||0,s=1,tx=0,ty=0;
  const el=document.createElement('div');el.className='pv';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',name);
  el.innerHTML=`<div class="pv-top"><button class="pv-btn" data-a="x" aria-label="${esc(tr('close'))}">${ic('x')}</button><b aria-live="polite"></b><span style="width:44px"></span></div>
    <div class="pv-st"><img alt="" draggable="false"></div>
    <button class="pv-btn pv-nav p" data-a="p" aria-label="${esc(tr('prevP'))}"${n>1?'':' hidden'}>${ic('chevL')}</button>
    <button class="pv-btn pv-nav n" data-a="n" aria-label="${esc(tr('nextP'))}"${n>1?'':' hidden'}>${ic('chevR')}</button>
    <div class="pv-hint">${esc(tr('zoomHint'))}</div>`;
  document.body.appendChild(el);
  const st=el.querySelector('.pv-st'),img=st.querySelector('img'),cap=el.querySelector('.pv-top b'),hint=el.querySelector('.pv-hint');
  const sheet=cur&&cur.el;if(sheet)sheet.inert=true;
  const opener=document.activeElement;
  setTimeout(()=>{hint.style.opacity='0';},2600);
  const box=()=>{const W=st.clientWidth,H=st.clientHeight,nw=img.naturalWidth||W,nh=img.naturalHeight||H,r=Math.min(W/nw,H/nh);return{W,H,cw:nw*r,ch:nh*r};};
  const clamp=()=>{const b=box(),mx=Math.max(0,(b.cw*s-b.W)/2),my=Math.max(0,(b.ch*s-b.H)/2);tx=Math.min(mx,Math.max(-mx,tx));ty=Math.min(my,Math.max(-my,ty));};
  const apply=(anim)=>{img.classList.toggle('anim',!!anim);img.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${s})`;el.classList.toggle('zoomed',s>1.01);};
  const reset=(anim)=>{s=1;tx=0;ty=0;img.style.opacity='';apply(anim);};
  const show=k=>{i=(k+n)%n;img.src=list[i];reset(false);cap.textContent=n>1?tr('photoOf',{i:i+1,n}):name;
    [list[(i+1)%n],list[(i-1+n)%n]].forEach(u=>{if(u){const x=new Image();x.src=u;}});onIndex&&onIndex(i);};
  const zoomAt=(px,py,ns)=>{const r=st.getBoundingClientRect(),p={x:px-r.left-r.width/2,y:py-r.top-r.height/2};
    const c={x:(p.x-tx)/s,y:(p.y-ty)/s};s=Math.min(4,Math.max(1,ns));tx=p.x-s*c.x;ty=p.y-s*c.y;if(s<=1.01){s=1;tx=0;ty=0;}clamp();};
  /* жесты */
  const pts=new Map();let g=null,lastTap=0;
  st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){const [a,b]=[...pts.values()];g={pinch:1,d0:Math.hypot(a.x-b.x,a.y-b.y),s0:s,m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},tx0:tx,ty0:ty};}
    else if(pts.size===1)g={x0:e.clientX,y0:e.clientY,tx0:tx,ty0:ty,t0:performance.now(),moved:0};});
  st.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!g)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(g.pinch&&pts.size>=2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      const r=st.getBoundingClientRect(),c0={x:(g.m0.x-r.left-r.width/2-g.tx0)/g.s0,y:(g.m0.y-r.top-r.height/2-g.ty0)/g.s0};
      s=Math.min(4,Math.max(.8,g.s0*d/g.d0));tx=m.x-r.left-r.width/2-s*c0.x;ty=m.y-r.top-r.height/2-s*c0.y;apply(false);return;}
    if(g.pinch)return;
    const dx=e.clientX-g.x0,dy=e.clientY-g.y0;g.moved=Math.max(g.moved,Math.hypot(dx,dy));
    if(s>1.01){tx=g.tx0+dx;ty=g.ty0+dy;clamp();apply(false);return;}
    if(!g.dir&&g.moved>8)g.dir=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(g.dir==='x'&&n>1){tx=dx;apply(false);}
    else if(g.dir==='y'&&dy>0){ty=dy;img.style.opacity=String(Math.max(.35,1-dy/400));apply(false);}});
  const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(!g)return;
    if(g.pinch){if(pts.size===0){if(s<1.05)reset(true);else{clamp();apply(true);}g=null;}return;}
    const dx=e.clientX-g.x0,dy=e.clientY-g.y0,dt=performance.now()-g.t0;
    if(g.moved<10&&dt<300){const now=performance.now();
      if(now-lastTap<320){lastTap=0;if(s>1.01)reset(true);else{zoomAt(e.clientX,e.clientY,2.5);apply(true);}hap('sel');}
      else lastTap=now;g=null;return;}
    if(s<=1.01){if(g.dir==='x'&&n>1&&Math.abs(dx)>60){hap('sel');show(i+(dx<0?1:-1));}
      else if(g.dir==='y'&&dy>110){close();}
      else reset(true);}
    g=null;};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,s*(e.deltaY<0?1.15:1/1.15));apply(false);},{passive:false});
  el.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;hap('sel');
    if(a.dataset.a==='x')close();else show(i+(a.dataset.a==='n'?1:-1));});
  const key=e=>{if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();close();}
    else if(e.key==='ArrowRight'&&n>1)show(i+1);else if(e.key==='ArrowLeft'&&n>1)show(i-1);
    else if(e.key==='+'||e.key==='='){const r=st.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,s*1.5);apply(true);}
    else if(e.key==='-'){const r=st.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,s/1.5);apply(true);}
    else if(e.key==='Tab'){const f=[...el.querySelectorAll('button:not([hidden])')].filter(x=>x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}};
  document.addEventListener('keydown',key,true);
  function close(){if(!PV)return;PV=null;document.removeEventListener('keydown',key,true);el.classList.remove('in');if(sheet)sheet.inert=false;
    setTimeout(()=>el.remove(),260);syncMain();try{opener&&opener.focus&&opener.focus({preventScroll:true});}catch(_){}updateBack();}
  PV={close};show(i);syncMain();
  requestAnimationFrame(()=>{el.classList.add('in');el.querySelector('[data-a="x"]').focus({preventScroll:true});});
  updateBack();
}

  if(cur)closeSheet(true);
  const scrim=document.createElement('div');scrim.className='scrim';
  const el=document.createElement('div');el.className='sheet';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  const hid='sh'+Date.now();
  el.innerHTML=`<div class="grab" aria-hidden="true"><i></i></div><div class="hd">${noClose?'':`<button class="close press" aria-label="${esc(tr('close'))}">${ic('x')}</button>`}<h2 id="${hid}">${esc(title||'')}</h2></div><div class="bd">${body}</div>${foot?`<div class="ft">${foot}</div>`:''}`;
  document.body.append(scrim,el);document.body.classList.add('locked');
  if(title)el.setAttribute('aria-labelledby',hid);else{const h=el.querySelector('.bd h1,.bd h2,.bd h3,.bd .h1');if(h){h.id=hid+'b';el.setAttribute('aria-labelledby',h.id);}}
  /* фон недоступен для клавиатуры и экранного диктора, пока открыто окно */
  const back=[$('app'),$('nav'),$('dock')];back.forEach(n=>n&&(n.inert=true));
  const opener=document.activeElement;
  requestAnimationFrame(()=>{scrim.classList.add('in');el.classList.add('in');
    el.tabIndex=-1;const f=el.querySelector('.close')||el.querySelector('.ft button')||el;try{f&&f.focus({preventScroll:true});}catch(e){}});
  scrim.onclick=()=>!noClose&&closeSheet();
  const cb=el.querySelector('.close');if(cb)cb.onclick=()=>closeSheet();
  // drag to dismiss
  let y0=null,dy=0;const bd=el.querySelector('.bd');
  const start=e=>{if(noClose)return;if(e.currentTarget===bd&&bd.scrollTop>0)return;y0=e.touches[0].clientY;dy=0;el.style.transition='none';};
  const move=e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);if(dy>0&&e.cancelable&&e.currentTarget!==bd)e.preventDefault();if(dy>0)el.style.transform=`translateY(${dy}px)`;};
  const end=()=>{if(y0==null)return;y0=null;el.style.transition='';if(dy>110)closeSheet();else el.style.transform='';};
  [el.querySelector('.grab'),el.querySelector('.hd'),bd].forEach(z=>{z.addEventListener('touchstart',start,{passive:true});z.addEventListener('touchmove',move,{passive:false});z.addEventListener('touchend',end);});
  cur={el,scrim,onClose,bd,noClose,opener,back};updateBack();syncMain();
  return cur;
}
document.addEventListener('keydown',e=>{
  if(!cur)return;
  if(e.key==='Escape'&&!cur.noClose){e.preventDefault();closeSheet();return;}
  if(e.key==='Tab'){const f=[...cur.el.querySelectorAll('button:not([disabled]),input,textarea,select,[tabindex="0"]')].filter(x=>x.offsetParent!==null);if(!f.length)return;
    const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
});
function closeSheet(instant){
  if(!cur)return;const {el,scrim,onClose,opener,back}=cur;cur=null;
  back.forEach(n=>n&&(n.inert=false));
  setTimeout(()=>{if(!cur&&opener&&document.contains(opener)&&opener.focus)try{opener.focus({preventScroll:true});}catch(e){}},0);
  if(instant){el.remove();scrim.remove();}else{el.style.transform='translateY(100%)';scrim.classList.remove('in');setTimeout(()=>{el.remove();scrim.remove();},420);}
  if(!document.querySelector('.sheet.in:not([style*="100%"])'))document.body.classList.remove('locked');
  setTimeout(()=>{if(!cur)document.body.classList.remove('locked');},10);

}

/* ===== ОЧЕРЕДЬ ЗАКАЗОВ: повтор отправки при обрыве связи =====
   Заказ хранится на телефоне и уходит сам: при появлении сети, при возврате в приложение и по таймеру
   (5 с, 10 с, 20 с … до 5 минут). У каждого заказа свой oid — сервер не отправит его в группу дважды. */
const OUTBOX='mf_outbox_v1_'+UID;
const newOid=()=>{try{if(crypto.randomUUID)return crypto.randomUUID();}catch(e){}return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);};
const outboxGet=()=>LS.get(OUTBOX,[]);
const outboxPut=p=>{const a=outboxGet().filter(x=>x.oid!==p.oid);a.push(p);LS.set(OUTBOX,a);};
const outboxDel=oid=>LS.set(OUTBOX,outboxGet().filter(x=>x.oid!==oid));
async function postOrder(p){
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;const tm=setTimeout(()=>ctl&&ctl.abort(),15000);
  try{
    const r=await fetch(ORDER_URL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl&&ctl.signal,
      body:JSON.stringify({text:p.text,initData:(tg&&tg.initData)||p.initData||'',meta:p.meta})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok!==false)return{ok:true,feed:j.feed||'',dup:!!j.dup};
    /* 5xx, 409 «уже отправляется», 429 и ответ не от нашей функции — временно, пробуем ещё */
    return{ok:false,retry:r.status>=500||r.status===409||r.status===429||r.status===0,error:j.error||r.status};
  }catch(e){return{ok:false,retry:true,error:'network'};}
  finally{clearTimeout(tm);}
}
let flushing=false;
async function flushOutbox(force){
  if(flushing||navigator.onLine===false)return;const box=outboxGet();if(!box.length)return;
  flushing=true;
  try{
    for(const p of box){
      if(!force&&p.next>Date.now())continue;
      const res=await postOrder(p);
      const o=S.orders.find(x=>x.oid===p.oid);
      if(res.ok){outboxDel(p.oid);if(o){o.st='';save('orders',S.orders);}hap('ok');toast(tr('queuedSent',{n:p.no}),'check');
        feedAfterOrder(res.feed,(p.meta.items||[]).map(x=>x[0]));}
      else if(res.retry){p.tries=(p.tries||0)+1;p.next=Date.now()+Math.min(300000,5000*2**Math.min(6,p.tries-1));outboxPut(p);}
      else{outboxDel(p.oid);if(o){o.st='failed';save('orders',S.orders);}
        if(o&&o.cert&&S.cert.usedOn===p.no){S.cert.used=false;S.cert.usedOn='';LS.set('mf_cert_v1_'+UID,S.cert);}
        hap('err');toast(tr('queuedFail',{n:p.no}),'x');}
    }
  }finally{flushing=false;}
  if(S.tab==='profile')renderProfile();
}

const AUC={data:null,off:0,phase:'',lastPrice:0,seg:'now',sig:'',lw:0,raf:0,shown:null};
const nowS=()=>Date.now()+AUC.off;
/* та же формула, что в netlify/lib/auction.mjs — меняйте вместе */
function aucPrice(lot,now){
  const durMs=lot.durationMin*60000,declineMs=durMs*0.9;
  const holdActive=!!(lot.hold&&lot.hold.until>now),paused=(lot.paused||0)+(lot.hold&&!holdActive?lot.hold.until-lot.hold.since:0);
  const effNow=holdActive?lot.hold.since:now,elapsed=effNow-lot.startAt-paused;
  if(lot.status==='sold')return{phase:'sold',price:lot.sold?lot.sold.price:lot.min};
  if(lot.status==='cancelled')return{phase:'cancelled',price:lot.min};
  if(elapsed<0)return{phase:'scheduled',price:lot.start,startsAt:lot.startAt+paused};
  if(elapsed>=durMs&&!holdActive)return{phase:'ended',price:lot.min};
  const frac=Math.min(1,Math.floor(elapsed/1000)*1000/declineMs);
  const price=frac>=1?lot.min:Math.max(lot.min,Math.round(lot.start-(lot.start-lot.min)*frac));
  return{phase:holdActive?'held':'live',price,atMin:frac>=1,endAt:lot.startAt+paused+durMs};
}
const mmss=ms=>{ms=Math.max(0,ms);const t=Math.ceil(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`;};
async function aucApi(action,extra={}){
  try{const r=await fetch('/api/auction',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,initData:(tg&&tg.initData)||'',...extra})});return await r.json();}catch(e){return{ok:false,error:'network'};}
}
