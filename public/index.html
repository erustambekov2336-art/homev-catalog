<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Maison Forfè</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,Roboto,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.32,1.45,.52,1);
  --r-xl:26px;--r-lg:20px;--r-md:14px;
  --safe-top:max(env(safe-area-inset-top,0px),var(--tg-content-safe-area-inset-top,0px));
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{
  --bg:#F6F1E9;--surface:#FFFFFF;--surface2:#EEE6D9;--surface3:#E6DCCB;
  --ink:#221F1B;--ink2:#5E574D;--muted:#8C8375;--hair:rgba(34,31,27,.08);
  --accent:#A5803F;--accent-press:#8F6D33;--on-accent:#FFFFFF;--accent-soft:rgba(165,128,63,.13);
  --gold:#A5803F;--tile:#F3EDE3;--blend:multiply;--photo-filter:none;
  --glass:rgba(255,253,249,.72);--glass-line:rgba(255,255,255,.7);
  --shadow:0 10px 30px rgba(78,62,38,.10);--shadow-nav:0 12px 36px rgba(78,62,38,.18);
  --cta-glow:0 10px 26px rgba(165,128,63,.34);
  --ok:#3E7B4F;--ok-soft:rgba(62,123,79,.12);--bad:#B4453A;
  --scrim:rgba(34,31,27,.32);--icon-filter:none;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0C111C;--surface:#151C2B;--surface2:#1E2738;--surface3:#273248;
  --ink:#EDF0F7;--ink2:#B8C0D2;--muted:#8A93A8;--hair:rgba(237,240,247,.08);
  --accent:#86A6E3;--accent-press:#6F90D2;--on-accent:#0C111C;--accent-soft:rgba(134,166,227,.15);
  --gold:#C9A35E;--tile:#EEF1F6;--blend:multiply;--photo-filter:none;
  --glass:rgba(21,28,43,.72);--glass-line:rgba(255,255,255,.07);
  --shadow:0 10px 30px rgba(0,0,0,.35);--shadow-nav:0 14px 40px rgba(0,0,0,.55);
  --cta-glow:0 10px 28px rgba(134,166,227,.30);
  --ok:#6FC08A;--ok-soft:rgba(111,192,138,.14);--bad:#F08A80;
  --scrim:rgba(4,7,14,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background .35s var(--ease),color .35s var(--ease)}
body{overscroll-behavior-y:none}
body.locked{overflow:hidden}
button{font-family:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
input,textarea{font-family:inherit}
::-webkit-scrollbar{display:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
svg.ci{width:18px;height:18px;flex:0 0 auto}
.press{transition:transform .32s var(--spring),background .25s,opacity .25s}
.press:active{transform:scale(.94)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(110px + var(--safe-bot))}

/* top bar */
.top{position:sticky;top:0;z-index:30;padding:calc(var(--safe-top) + 10px) 18px 10px;transition:background .3s,box-shadow .3s,backdrop-filter .3s}
.top.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 1px 0 var(--hair)}
.top-row{display:flex;align-items:center;gap:10px;min-height:44px}
.title{flex:1;min-width:0;font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .sub{display:block;font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:3px}
.rbtn{width:42px;height:42px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 var(--hair) inset,0 0 0 1px var(--hair);flex:0 0 auto}
.rbtn .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.rbtn{position:relative}
.search{margin-top:12px;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{width:100%;height:46px;border-radius:15px;border:none;outline:none;background:var(--surface);color:var(--ink);font-size:16px;padding:0 40px 0 42px;box-shadow:0 0 0 1px var(--hair);transition:box-shadow .2s}
.search input:focus{box-shadow:0 0 0 2px var(--accent)}
.search input::placeholder{color:var(--muted)}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--muted)}
.search.has .clr{display:flex}

/* hero gift */
.hero{margin:6px 18px 0;border-radius:var(--r-xl);background:var(--surface2);padding:16px 16px 16px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);pointer-events:none}
.hero-ic{width:52px;height:52px;border-radius:16px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:0 0 auto}
.hero-ic svg{width:26px;height:26px}
.hero-b{flex:1;min-width:0}
.hero-k{font-size:12.5px;color:var(--muted)}
.hero-t{font-size:17px;font-weight:700;letter-spacing:-.3px;margin:2px 0 9px}
.bar{height:6px;border-radius:9px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent);transition:width .7s var(--ease)}
.hero-s{font-size:12px;color:var(--ink2);margin-top:7px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 18px 6px;scroll-padding-inline:18px}
.chip{flex:0 0 auto;height:38px;display:flex;align-items:center;gap:7px;padding:0 14px;border-radius:999px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;box-shadow:0 0 0 1px var(--hair);white-space:nowrap;scroll-snap-align:start;transition:background .25s,color .25s,transform .32s var(--spring)}
.chip:active{transform:scale(.94)}
.chip .n{font-size:12px;color:var(--muted);font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip.on .n{color:var(--bg);opacity:.6}
.chip.icon{width:38px;padding:0;justify-content:center;position:relative}
.chip.icon .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.meta-row{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 2px;font-size:13px;color:var(--muted)}
.meta-row button{color:var(--accent);font-weight:600;font-size:13px}

/* grid + cards */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:10px 14px 0}
.card{background:var(--surface);border-radius:var(--r-lg);padding:7px 7px 10px;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--hair)}
.card.enter{animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tile{position:relative;aspect-ratio:1/1;border-radius:15px;background:var(--tile);overflow:hidden;cursor:pointer}
.tile img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;mix-blend-mode:var(--blend);opacity:0;transition:opacity .45s var(--ease),transform .6s var(--ease)}
.tile img.ok{opacity:1}
.tile:active img{transform:scale(.96)}
.tile .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9A9285}
.tile .ph svg{width:40px;height:40px;opacity:.5}
.shimmer{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:220% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
.fav{position:absolute;top:7px;right:7px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#6E675C;transition:transform .35s var(--spring),color .2s}
.fav svg{width:17px;height:17px}
.fav.on{color:#C0563F}
.fav.on svg{fill:currentColor}
.fav.pop{animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.c-name{font-size:14px;font-weight:600;line-height:1.28;letter-spacing:-.15px;margin:10px 4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.c-meta{font-size:12px;color:var(--muted);margin:3px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:auto 2px 0 4px;padding-top:10px;min-height:44px}
.c-price{font-size:14.5px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.c-price small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.add{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.add svg{width:18px;height:18px;stroke-width:2.2}
.step{display:flex;align-items:center;height:34px;border-radius:999px;background:var(--accent-soft);color:var(--ink);animation:grow .35s var(--spring)}
@keyframes grow{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.step button{width:30px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.step button svg{width:16px;height:16px;stroke-width:2.2}
.step span{min-width:16px;text-align:center;font-size:14px;font-weight:700}
.skel{background:var(--surface);border-radius:var(--r-lg);padding:7px;box-shadow:0 0 0 1px var(--hair)}
.skel .t{aspect-ratio:1/1;border-radius:15px;background:var(--surface2);position:relative;overflow:hidden}
.skel .l{height:12px;border-radius:6px;background:var(--surface2);margin:12px 4px 0;width:80%}
.skel .l.s{width:50%;margin-top:8px}
.sentinel{height:1px}
.more{display:flex;justify-content:center;padding:18px}
.more button{height:44px;padding:0 24px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--hair);font-weight:600;font-size:14px}

/* empty */
.empty{text-align:center;padding:56px 32px 20px}
.empty .ic{width:76px;height:76px;border-radius:24px;background:var(--surface2);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.empty .ic svg{width:34px;height:34px;stroke-width:1.5}
.empty h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.4px}
.empty p{margin:8px auto 0;color:var(--muted);font-size:14.5px;line-height:1.45;max-width:280px}
.empty .btn{margin-top:22px}

/* lists */
.pad{padding:6px 18px 0}
.group{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--hair);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:88px;right:0;height:1px;background:var(--hair)}
.thumb{width:66px;height:66px;border-radius:14px;background:var(--tile);overflow:hidden;position:relative;flex:0 0 auto;cursor:pointer}
.thumb img{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;mix-blend-mode:var(--blend)}
.row .b{flex:1;min-width:0}
.row .n{font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .p{font-size:14.5px;font-weight:700;margin-top:6px;letter-spacing:-.2px}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.x{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface2)}
.x svg{width:15px;height:15px}
.sec-t{font-size:20px;font-weight:700;letter-spacing:-.4px;margin:26px 2px 10px}
.card2{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--hair);padding:16px}
.card2+.card2{margin-top:12px}

/* cert block in cart */
.cert{display:flex;gap:13px;align-items:center}
.cert .ic{width:46px;height:46px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:0 0 auto}
.cert .t{font-size:15px;font-weight:600}
.cert .s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.toggle{width:51px;height:31px;border-radius:999px;background:var(--surface3);position:relative;flex:0 0 auto;transition:background .25s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .35s var(--spring)}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}
.sum-row{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink2);padding:5px 0}
.sum-row.disc{color:var(--ok)}
.sum-row.tot{color:var(--ink);font-size:19px;font-weight:700;letter-spacing:-.4px;padding-top:12px;margin-top:8px;border-top:1px solid var(--hair)}

/* form */
.fld{margin-bottom:14px}
.fld label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:0 4px 6px;font-weight:500}
.fld label em{font-style:normal;opacity:.8}
.inp{width:100%;min-height:48px;border-radius:14px;border:none;outline:none;background:var(--surface2);color:var(--ink);font-size:16px;padding:13px 14px;box-shadow:0 0 0 1px transparent;transition:box-shadow .2s,background .2s;resize:none}
.inp:focus{box-shadow:0 0 0 2px var(--accent);background:var(--surface)}
.inp.bad{box-shadow:0 0 0 2px var(--bad)}
.inp::placeholder{color:var(--muted)}
.err{color:var(--bad);font-size:12.5px;margin:6px 4px 0}
.inline{display:flex;gap:8px}
.inline .inp{flex:1}
.tgbtn{flex:0 0 auto;height:48px;padding:0 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.tgbtn svg{width:17px;height:17px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);line-height:1.45;padding:2px 4px}
.note svg{color:var(--gold);width:18px;height:18px;margin-top:1px}

/* buttons */
.btn{height:54px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:16.5px;font-weight:650;font-weight:600;letter-spacing:-.2px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 26px;box-shadow:var(--cta-glow);transition:transform .32s var(--spring),background .2s,box-shadow .2s}
.btn:active{transform:scale(.96);background:var(--accent-press)}
.btn.full{width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none}
.btn.sm{height:42px;font-size:14.5px;padding:0 18px}
.btn[disabled]{opacity:.6}
.link{color:var(--accent);font-weight:600;font-size:14.5px}
.dock{position:fixed;left:0;right:0;bottom:calc(84px + var(--safe-bot));z-index:35;padding:0 18px;pointer-events:none;display:flex;justify-content:center}
.dock .btn{pointer-events:auto;width:100%;max-width:524px}
.dock .btn .amt{opacity:.75;font-weight:600}

/* nav */
.nav{position:fixed;left:50%;bottom:calc(14px + var(--safe-bot));transform:translateX(-50%);z-index:40;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:var(--shadow-nav),inset 0 0 0 1px var(--glass-line)}
.nav .ind{position:absolute;top:5px;left:5px;height:calc(100% - 10px);border-radius:999px;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.08),inset 0 0 0 1px var(--hair);transition:transform .5s var(--spring),width .5s var(--spring)}
.nav button{position:relative;z-index:1;height:52px;min-width:64px;padding:0 12px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;transition:color .3s}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.nav button.on svg.fillable{fill:currentColor;fill-opacity:.15}
.nav .bdg{position:absolute;top:5px;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.nav .bdg.pop{animation:pop .45s var(--spring)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .3s var(--ease)}
.scrim.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;margin:0 auto;max-width:560px;max-height:calc(100vh - var(--safe-top) - 24px);background:var(--surface);border-radius:30px 30px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .5s var(--ease)}
.sheet.in{transform:none}
.sheet .grab{flex:0 0 auto;padding:10px 0 4px;display:flex;justify-content:center;touch-action:none}
.sheet .grab i{width:38px;height:5px;border-radius:9px;background:var(--surface3)}
.sheet .hd{flex:0 0 auto;display:flex;align-items:center;justify-content:center;position:relative;min-height:46px;padding:0 64px;touch-action:none}
.sheet .hd h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px;text-align:center}
.sheet .close{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.sheet .close svg{width:18px;height:18px;stroke-width:2.2}
.sheet .bd{overflow-y:auto;padding:8px 20px 20px;-webkit-overflow-scrolling:touch}
.sheet .ft{flex:0 0 auto;padding:12px 20px calc(14px + var(--safe-bot));background:linear-gradient(to top,var(--surface) 70%,transparent)}

/* product sheet */
.p-photo{position:relative;border-radius:24px;background:var(--tile);aspect-ratio:4/3;overflow:hidden}
.p-photo img{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;mix-blend-mode:var(--blend)}
.p-photo .fav{top:12px;right:12px;width:40px;height:40px}
.p-photo .fav svg{width:19px;height:19px}
.p-name{font-size:25px;font-weight:700;letter-spacing:-.6px;margin:18px 0 0;line-height:1.15}
.p-sub{font-size:14.5px;color:var(--muted);margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--ok-soft);color:var(--ok)}
.pill.off{background:rgba(180,69,58,.12);color:var(--bad)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.specs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}
.spec{background:var(--surface2);border-radius:16px;padding:11px 12px}
.spec .k{font-size:11.5px;color:var(--muted)}
.spec .v{font-size:14px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badges img{height:52px;width:auto;max-width:100%;object-fit:contain;border-radius:12px;background:#fff;padding:6px 8px}
.p-price{display:flex;align-items:baseline;gap:10px;margin-top:20px}
.p-price b{font-size:26px;font-weight:700;letter-spacing:-.7px}
.p-price span{font-size:14px;color:var(--muted)}
.buybar{display:flex;gap:10px;align-items:center}
.qty{display:flex;align-items:center;height:54px;border-radius:999px;background:var(--surface2);flex:0 0 auto}
.qty button{width:46px;height:54px;display:flex;align-items:center;justify-content:center}
.qty button svg{width:18px;height:18px;stroke-width:2.2}
.qty span{min-width:22px;text-align:center;font-size:17px;font-weight:700}
.buybar .btn{flex:1;padding:0 14px}

/* segmented + filter */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:3px;position:relative}
.seg button{flex:1;height:38px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink2);transition:background .25s,color .25s,box-shadow .25s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08),0 0 0 1px var(--hair)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px;border-radius:16px;background:var(--surface2);font-size:15.5px;font-weight:500;transition:background .2s,box-shadow .2s}
.opt.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt .ck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--surface3);display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.opt.on .ck{background:var(--accent);box-shadow:none}
.opt .ck svg{width:14px;height:14px;stroke-width:3;opacity:0}
.opt.on .ck svg{opacity:1}
.lbl{font-size:13px;color:var(--muted);font-weight:500;margin:4px 4px 10px}

/* profile */
.prof{text-align:center;padding:8px 18px 4px}
.ava{width:92px;height:92px;border-radius:50%;margin:0 auto;background:linear-gradient(145deg,var(--gold),var(--accent));display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#fff;overflow:hidden;box-shadow:0 0 0 4px var(--surface),0 10px 30px rgba(0,0,0,.12)}
.ava img{width:100%;height:100%;object-fit:cover}
.prof h2{margin:14px 0 0;font-size:24px;font-weight:700;letter-spacing:-.5px}
.prof .u{color:var(--muted);font-size:14.5px;margin-top:3px}
.giftcard{position:relative;border-radius:24px;overflow:hidden;padding:18px;color:#FBF6EC;background:#221F1B;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
html[data-theme="dark"] .giftcard{background:#1B2540}
.giftcard::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(201,163,94,.45),transparent 60%),radial-gradient(80% 80% at 0% 100%,rgba(165,128,63,.22),transparent 60%)}
.giftcard>*{position:relative}
.giftcard .k{font-size:12.5px;opacity:.7}
.giftcard .amt{font-size:30px;font-weight:700;letter-spacing:-.8px;margin-top:4px}
.giftcard .f{display:flex;justify-content:space-between;align-items:flex-end;font-size:12.5px;opacity:.85;margin-top:16px}
.giftcard .code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;font-size:13px;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.12)}
.giftcard.used{filter:grayscale(.8);opacity:.75}
.mrow{display:flex;align-items:center;gap:13px;padding:13px 14px;position:relative;width:100%;text-align:left}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--hair)}
.mrow .mi{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--gold);flex:0 0 auto}
.mrow .mi svg{width:19px;height:19px}
.mrow .mt{flex:1;min-width:0;font-size:15.5px;font-weight:500}
.mrow .mt small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.mrow .mv{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:4px}
.mrow .mv svg{width:16px;height:16px}
.steps{display:flex;flex-direction:column;gap:0}
.stp{display:flex;gap:14px;position:relative;padding-bottom:16px}
.stp:last-child{padding-bottom:0}
.stp .n{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative;z-index:1}
.stp:not(:last-child)::before{content:"";position:absolute;left:14.5px;top:30px;bottom:0;width:1px;background:var(--hair)}
.stp .tx{font-size:14.5px;line-height:1.45;padding-top:5px}
.order{padding:14px}
.order+.order{border-top:1px solid var(--hair)}
.order .h{display:flex;justify-content:space-between;align-items:baseline}
.order .no{font-weight:700;font-size:15px}
.order .dt{font-size:12.5px;color:var(--muted)}
.order .its{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.45}
.order .f{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.order .f b{font-size:15px}

/* welcome */
.wel-art{border-radius:26px;overflow:hidden;aspect-ratio:1/1;max-width:240px;margin:6px auto 0;box-shadow:0 18px 40px rgba(0,0,0,.18);animation:float 5s ease-in-out infinite}
.wel-art img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
.center{text-align:center}
.h1{font-size:25px;font-weight:700;letter-spacing:-.6px;margin:22px 0 0;line-height:1.15}
.lead{color:var(--muted);font-size:15px;line-height:1.5;margin:10px auto 0;max-width:330px}
.done-ic{width:84px;height:84px;border-radius:50%;margin:10px auto 0;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;animation:pop .6s var(--spring)}
.done-ic svg{width:40px;height:40px;stroke-width:2.4}
.summary .it{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:7px 0}
.summary .it span:first-child{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary .it span:last-child{font-weight:600;flex:0 0 auto}

/* toast */
.toast{position:fixed;left:50%;top:calc(var(--safe-top) + 12px);z-index:90;transform:translate(-50%,-140%);display:flex;align-items:center;gap:9px;padding:11px 16px 11px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .5s var(--spring);max-width:calc(100% - 32px);white-space:nowrap}
.toast.in{transform:translate(-50%,0)}
.toast .ti{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.toast .ti svg{width:14px;height:14px;stroke-width:2.6}
.view{display:none}
.view.on{display:block;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== Liquid Glass ===== */
html[data-theme="light"]{
  --lg-fill:rgba(255,255,255,.42);--lg-fill-strong:rgba(255,255,255,.55);
  --lg-rim:rgba(255,255,255,.95);--lg-rim2:rgba(255,255,255,.25);--lg-edge:rgba(120,96,58,.14);
  --lg-shadow:0 8px 28px rgba(78,62,38,.16),0 1px 2px rgba(78,62,38,.08);
  --amb1:rgba(201,163,94,.42);--amb2:rgba(140,160,200,.30);--amb3:rgba(232,190,150,.38);
}
html[data-theme="dark"]{
  --lg-fill:rgba(30,39,56,.38);--lg-fill-strong:rgba(255,255,255,.11);
  --lg-rim:rgba(255,255,255,.38);--lg-rim2:rgba(255,255,255,.06);--lg-edge:rgba(0,0,0,.35);
  --lg-shadow:0 10px 32px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --amb1:rgba(70,110,200,.45);--amb2:rgba(201,163,94,.20);--amb3:rgba(40,70,150,.40);
}
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(60px);animation:drift 22s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:340px;height:340px;top:-110px;right:-90px;background:var(--amb1)}
.ambient i:nth-child(2){width:380px;height:380px;bottom:8%;left:-150px;background:var(--amb2);animation-delay:-8s}
.ambient i:nth-child(3){width:260px;height:260px;top:42%;right:-120px;background:var(--amb3);animation-delay:-14s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-30px,40px) scale(1.12)}}
html,body{background:var(--bg)}
.lg{position:relative;isolation:isolate;background:var(--lg-fill);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.04);backdrop-filter:blur(18px) saturate(190%) brightness(1.04);box-shadow:var(--lg-shadow),inset 0 0 0 .5px var(--lg-edge)}
.lg::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:linear-gradient(150deg,var(--lg-rim) 0%,var(--lg-rim2) 28%,transparent 50%,var(--lg-rim2) 74%,var(--lg-rim) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.28),transparent 55%)}
html[data-theme="dark"] .lg::after{background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.10),transparent 55%)}
/* controls on glass */
.rbtn{box-shadow:none}
.rbtn.lg{background:var(--lg-fill)}
.search input{background:var(--lg-fill);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);box-shadow:var(--lg-shadow),inset 0 0 0 .5px var(--lg-edge),inset 0 1px 0 var(--lg-rim)}
.top.scrolled{background:linear-gradient(to bottom,var(--bg) 0%,color-mix(in srgb,var(--bg) 55%,transparent) 100%);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:none;
  -webkit-mask:linear-gradient(#000 80%,transparent);mask:linear-gradient(#000 80%,transparent);padding-bottom:16px}
.chip:not(.on){background:var(--lg-fill);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--lg-edge),inset 0 1px 0 var(--lg-rim)}
.hero{background:var(--lg-fill-strong);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--lg-shadow),inset 0 0 0 .5px var(--lg-edge),inset 0 1px 0 var(--lg-rim)}
.hero-ic{background:var(--lg-fill-strong);box-shadow:inset 0 1px 0 var(--lg-rim)}
.fav{background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(14px) saturate(200%) brightness(1.08);backdrop-filter:blur(14px) saturate(200%) brightness(1.08);box-shadow:0 2px 10px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 .5px rgba(0,0,0,.08);color:#5E574D}
/* nav */
.nav{background:var(--lg-fill);-webkit-backdrop-filter:blur(14px) saturate(210%) brightness(1.06) contrast(.92);backdrop-filter:blur(14px) saturate(210%) brightness(1.06) contrast(.92);box-shadow:var(--lg-shadow),inset 0 0 0 .5px var(--lg-edge)}
.nav.lg{position:fixed}
.nav .ind{background:var(--lg-fill-strong);box-shadow:0 2px 12px rgba(0,0,0,.10),inset 0 1px 0 var(--lg-rim),inset 0 -1px 0 var(--lg-rim2),inset 0 0 0 .5px var(--lg-edge)}
html[data-theme="dark"] .nav .ind{background:rgba(255,255,255,.13)}
.nav.squish .ind{animation:squish .5s var(--spring)}
@keyframes squish{0%{scale:1 1}35%{scale:1.12 .9}70%{scale:.97 1.04}100%{scale:1 1}}
/* sheets as glass */
.sheet{background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%);box-shadow:0 -20px 60px rgba(0,0,0,.18),inset 0 1px 0 var(--lg-rim)}
.sheet .ft{background:linear-gradient(to top,color-mix(in srgb,var(--surface) 85%,transparent) 60%,transparent)}
.sheet .close{background:var(--lg-fill);box-shadow:inset 0 1px 0 var(--lg-rim),inset 0 0 0 .5px var(--lg-edge)}
.scrim{background:color-mix(in srgb,var(--scrim) 70%,transparent);-webkit-backdrop-filter:blur(4px) saturate(120%);backdrop-filter:blur(4px) saturate(120%)}
/* toast */
.toast{background:color-mix(in srgb,var(--ink) 78%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18)}
/* primary button: tinted glass sheen */
.btn:not(.ghost){position:relative;overflow:hidden}
.btn:not(.ghost)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.08)}
.add{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
/* content cards: slightly translucent so the ambience breathes through */
.card,.group,.card2{background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.lg,.nav,.sheet,.chip:not(.on),.hero{background:var(--surface)}}
@media (prefers-reduced-transparency:reduce){.lg,.nav,.sheet,.hero,.chip:not(.on),.card,.group,.card2{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}.ambient{display:none}}

/* ===== Облегчённый режим для слабых Android ===== */
html.lite .card,html.lite .group,html.lite .card2{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
html.lite .chip:not(.on),html.lite .search input,html.lite .hero,html.lite .hero-ic,html.lite .rbtn.lg,html.lite .sheet .close{-webkit-backdrop-filter:none;backdrop-filter:none}
html.lite .chip:not(.on),html.lite .search input,html.lite .rbtn.lg{background:var(--surface)}
html.lite .hero{background:var(--surface2)}
html.lite .fav{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.88)}
html.lite .top.scrolled{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg);-webkit-mask:none;mask:none;box-shadow:0 1px 0 var(--hair)}
html.lite .nav{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:color-mix(in srgb,var(--surface) 82%,transparent)}
html.lite .sheet{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface)}
html.lite .sheet .ft{background:linear-gradient(to top,var(--surface) 70%,transparent)}
html.lite .scrim,html.lite .toast,html.lite .tile .fav{-webkit-backdrop-filter:none;backdrop-filter:none}
html.lite .toast{background:var(--ink)}
html.lite .ambient i{animation:none;filter:blur(40px)}
html.lite .lg::after{display:none}
</style>
</head>

/* Uzbek Latin -> Cyrillic */
function toCyr(s){
  const ap="['‘’ʻʼ`]";
  const R=[[new RegExp('O'+ap,'g'),'Ў'],[new RegExp('o'+ap,'g'),'ў'],[new RegExp('G'+ap,'g'),'Ғ'],[new RegExp('g'+ap,'g'),'ғ'],
   [/Sh/g,'Ш'],[/SH/g,'Ш'],[/sh/g,'ш'],[/Ch/g,'Ч'],[/CH/g,'Ч'],[/ch/g,'ч'],[/Yo/g,'Ё'],[/yo/g,'ё'],[/Yu/g,'Ю'],[/yu/g,'ю'],[/Ya/g,'Я'],[/ya/g,'я'],[/Ye/g,'Е'],[/ye/g,'е'],
   [/\bE/g,'Э'],[/\be/g,'э'],[new RegExp('([a-zA-Z])'+ap,'g'),'$1ъ']];
  const M={a:'а',b:'б',d:'д',e:'е',f:'ф',g:'г',h:'ҳ',i:'и',j:'ж',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',q:'қ',r:'р',s:'с',t:'т',u:'у',v:'в',x:'х',y:'й',z:'з',c:'с',w:'в'};
  return s.split(/(\{[a-z]+\}|\d[\d\s]*)/).map((part,i)=>{
    if(i%2) return part;
    R.forEach(([re,v])=>part=part.replace(re,v));
    return part.replace(/[a-zA-Z]/g,ch=>{const l=ch.toLowerCase();const c=M[l]||ch;return ch===l?c:c.toUpperCase();});
  }).join('');
}

/* SHEETS */
let cur=null;
function openSheet({title,body,foot,onClose,noClose}){
  if(cur)closeSheet(true);
  const scrim=document.createElement('div');scrim.className='scrim';
  const el=document.createElement('div');el.className='sheet';el.setAttribute('role','dialog');
  el.innerHTML=`<div class="grab"><i></i></div><div class="hd">${noClose?'':`<button class="close press" aria-label="${esc(tr('close'))}">${ic('x')}</button>`}<h2>${esc(title||'')}</h2></div><div class="bd">${body}</div>${foot?`<div class="ft">${foot}</div>`:''}`;
  document.body.append(scrim,el);document.body.classList.add('locked');
  requestAnimationFrame(()=>{scrim.classList.add('in');el.classList.add('in');});
  scrim.onclick=()=>!noClose&&closeSheet();
  const cb=el.querySelector('.close');if(cb)cb.onclick=()=>closeSheet();
  // drag to dismiss
  let y0=null,dy=0;const bd=el.querySelector('.bd');
  const start=e=>{if(noClose)return;if(e.currentTarget===bd&&bd.scrollTop>0)return;y0=e.touches[0].clientY;dy=0;el.style.transition='none';};
  const move=e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);if(dy>0&&e.cancelable&&e.currentTarget!==bd)e.preventDefault();if(dy>0)el.style.transform=`translateY(${dy}px)`;};
  const end=()=>{if(y0==null)return;y0=null;el.style.transition='';if(dy>110)closeSheet();else el.style.transform='';};
  [el.querySelector('.grab'),el.querySelector('.hd'),bd].forEach(z=>{z.addEventListener('touchstart',start,{passive:true});z.addEventListener('touchmove',move,{passive:false});z.addEventListener('touchend',end);});
  cur={el,scrim,onClose,bd};updateBack();
  return cur;
}
function closeSheet(instant){
  if(!cur)return;const {el,scrim,onClose}=cur;cur=null;
  if(instant){el.remove();scrim.remove();}else{el.style.transform='translateY(100%)';scrim.classList.remove('in');setTimeout(()=>{el.remove();scrim.remove();},420);}
  if(!document.querySelector('.sheet.in:not([style*="100%"])'))document.body.classList.remove('locked');
  setTimeout(()=>{if(!cur)document.body.classList.remove('locked');},10);
  onClose&&onClose();updateBack();

/* лёгкий режим: слабые Android сразу, остальные — если прокрутка проседает */
(function perf(){
  const ua=navigator.userAgent||'';const root=document.documentElement;
  const forced=new URLSearchParams(location.search).get('lite');
  if(forced==='0'){root.classList.remove('lite');return;}
  if(forced==='1'||LS.get('mf_lite',false)){root.classList.add('lite');return;}
  const android=/Android/i.test(ua);
  const tgClass=(ua.match(/Telegram-Android\/[^(]*\([^)]*;\s*(LOW|AVERAGE|HIGH)\)/i)||[])[1];
  const mem=navigator.deviceMemory||8,cores=navigator.hardwareConcurrency||8;
  if(android&&(tgClass==='LOW'||(tgClass!=='HIGH'&&(mem<=4||cores<=4)))){root.classList.add('lite');return;}
  // замер плавности на первых прокрутках
  let frames=0,slow=0,last=0,watching=false,stopT;
  const tick=t=>{if(!watching)return;if(last){const d=t-last;frames++;if(d>28)slow++;}last=t;requestAnimationFrame(tick);};
  const onScroll=()=>{
    if(root.classList.contains('lite'))return;
    if(!watching){watching=true;last=0;requestAnimationFrame(tick);}
    clearTimeout(stopT);stopT=setTimeout(()=>{watching=false;
      if(frames>=40){ if(slow/frames>0.25){root.classList.add('lite');LS.set('mf_lite',true);removeEventListener('scroll',onScroll);} else if(frames>240){removeEventListener('scroll',onScroll);} }
    },400);
  };
  addEventListener('scroll',onScroll,{passive:true});
})();

  }).catch(()=>{$('grid').innerHTML='';$('catEmpty').innerHTML=`<div class="empty"><div class="ic">${ic('x')}</div><h3>Нет соединения</h3><p>Проверьте интернет и откройте каталог ещё раз.</p></div>`;});
})();
