/* «бегущие» цифры: за долю секунды прокручиваем от прошлой цены до новой */
function aucRoll(el,from,to){
  cancelAnimationFrame(AUC.raf);
  if(!from||from===to||Math.abs(from-to)>(AUC.data&&AUC.data.current?(AUC.data.current.start-AUC.data.current.min)/20:1e9)||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=num(to);return;}
  const t0=performance.now(),D=700;
  const f=t=>{const k=Math.min(1,(t-t0)/D);el.textContent=num(Math.round(from+(to-from)*k));if(k<1)AUC.raf=requestAnimationFrame(f);};
  AUC.raf=requestAnimationFrame(f);
}
function aucTick(){
  if(S.tab!=='auction'||!AUC.data)return;
  const d=AUC.data,now=nowS();
  document.querySelectorAll('#v-auction [data-cd]').forEach(x=>{x.textContent=tr('aucStartsIn',{t:mmss(+x.dataset.cd-now)});});
  if(AUC.seg==='soon')return;
  if(d.current){
    const lot=d.current,p=aucPrice(lot,now);
    if(p.phase!==AUC.phase){AUC.phase=p.phase;loadAuction();return;}
    const P=$('aP');if(!P)return;
    if(p.price!==AUC.lastPrice){aucRoll(P,AUC.lastPrice,p.price);AUC.lastPrice=p.price;$('aBar').style.width=aucPct(lot,p.price)+'%';}
    $('aEnd').textContent=p.endAt?tr('aucLeft',{t:mmss(p.endAt-now)}):'';
    $('aMin').hidden=!p.atMin;$('aSub').hidden=!!p.atMin;
    const it=S.byId[lot.itemId],cp=(it&&it.price_uzs)||lot.catalogPrice||0,C=$('aChips');
    if(C){const pct=cp?Math.floor((1-p.price/cp)*100):0;const k=cp+'|'+pct;if(AUC.shown!==k){AUC.shown=k;C.innerHTML=cp?`<span class="ax-chip">${ic('store')}${esc(tr('aucCat'))} <s>${num(cp)}</s></span>${pct>=1?`<span class="ax-chip ok">${esc(tr('aucSave',{n:pct}))}</span>`:''}`:'';}}
    const bb=$('aBuy');
    if(p.phase==='held'&&lot.hold&&lot.hold.mine){bb.className='ax-buy press';bb.textContent=tr('aucContinue',{t:mmss(lot.hold.until-now)});}
    else if(p.phase==='held'){bb.className='ax-buy press wait';bb.innerHTML=ic('lock')+esc(tr('aucHeldOther',{t:mmss(lot.hold.until-now)}));}

  }else if(d.next){
    const c=$('aCount');if(c){const ms=d.next.startAt-now;if(ms<=0){loadAuction();return;}c.textContent=mmss(ms);}
  }
}

let VQ={},vqT=0;
function trackView(id){if(S.isAdmin)return;VQ[id]=(VQ[id]||0)+1;clearTimeout(vqT);vqT=setTimeout(flushViews,15000);}
function flushViews(){
  const v=VQ;if(!Object.keys(v).length)return;VQ={};clearTimeout(vqT);
  const body=JSON.stringify({action:'views',views:v});
  try{if(navigator.sendBeacon&&navigator.sendBeacon('/api/stats',new Blob([body],{type:'application/json'})))return;}catch(e){}
  fetch('/api/stats',{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:true}).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushViews();});

    <div class="st-t"><span>Заказы</span><b>${num(t.orders)}</b><small>${t.auction?`из них аукцион: ${t.auction}`:'&nbsp;'}</small></div>
    <div class="st-t"><span>Выручка</span><b>${shortMoney(t.revenue)}</b><small>${t.revenue?money(t.revenue):'сум'}</small></div>
    <div class="st-t"><span>Средний чек</span><b>${t.avg?shortMoney(t.avg):'—'}</b><small>${t.avg?money(t.avg):'&nbsp;'}</small></div>
    <div class="st-t"><span>Просмотры товаров</span><b>${num(t.views)}</b><small>${t.views&&t.orders?`заказ на каждые ${Math.max(1,Math.round(t.views/t.orders))}`:'&nbsp;'}</small></div>
   </div>
   ${empty?`<p class="st-note">Данных пока нет: статистика копится с момента обновления сайта. Тестовые заказы (с «тест» в комментарии) не учитываются.</p>`:''}
   <div class="st-card">
    <div class="st-ch-h"><h3>По дням, 14 дней</h3><div class="st-mt" role="group" aria-label="Показатель">${[['orders','Заказы'],['revenue','Выручка']].map(([k,l])=>`<button data-m="${k}" class="${key===k?'on':''}" aria-pressed="${key===k}">${l}</button>`).join('')}</div></div>
    <div class="st-chart" role="group" aria-label="${key==='orders'?'Заказы':'Выручка'} по дням">
     <div class="st-grid" aria-hidden="true"><span style="bottom:100%"><i>${fmtV(max)}</i></span><span style="bottom:50%"><i>${fmtV(Math.round(max/2))}</i></span><span style="bottom:0"></span></div>
     <div class="st-bars">${ser.map((s,i)=>`<button class="st-b${i===st.sel?' on':''}" data-i="${i}" aria-label="${esc(lbl(s))}" aria-pressed="${i===st.sel}"><i style="height:${s[key]?Math.max(3,s[key]/max*100):0}%"></i><em>${+s.day.slice(8)}</em></button>`).join('')}</div>
    </div>
    <div class="st-sel" aria-live="polite"><b>${esc(dayLbl(x.day,{weekday:'long'}))}</b><span>${x.orders} ${plural(x.orders,['заказ','заказа','заказов'])} · ${money(x.revenue)} · ${x.views} ${plural(x.views,['просмотр','просмотра','просмотров'])}</span></div>
    <details class="st-tbl"><summary>Таблица по дням</summary><table><thead><tr><th scope="col">День</th><th scope="col">Заказы</th><th scope="col">Выручка</th><th scope="col">Просмотры</th></tr></thead><tbody>${ser.slice().reverse().map(s=>`<tr><th scope="row">${esc(dayLbl(s.day))}</th><td>${s.orders}</td><td>${num(s.revenue)}</td><td>${s.views}</td></tr>`).join('')}</tbody></table></details>
   </div>
   ${d.topOrdered.length?`<div class="sec-t" style="font-size:16px;margin-top:22px">Чаще заказывают · 30 дней</div><div class="group st-list">${d.topOrdered.map(r=>row(r,'o')).join('')}</div>`:''}
   ${d.topViewed.length?`<div class="sec-t" style="font-size:16px;margin-top:22px">Чаще смотрят · 30 дней</div><div class="group st-list">${d.topViewed.map(r=>row(r,'v')).join('')}</div>`:''}
   <p class="st-note">${d.since?`Данные с ${esc(dayLbl(d.since))}. `:''}Время ташкентское. Тестовые заказы не учитываются, просмотры владельца тоже.</p>`;
  const re=p=>{renderStats(sh,d,Object.assign({},st,p));};
  sh.bd.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{hap('sel');re({period:b.dataset.p});});
  sh.bd.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{hap('sel');re({metric:b.dataset.m});});
  sh.bd.querySelectorAll('.st-b').forEach(b=>{b.onclick=()=>{hap('sel');re({sel:+b.dataset.i});setTimeout(()=>{const n=sh.bd.querySelector(`.st-b[data-i="${b.dataset.i}"]`);n&&n.focus({preventScroll:true});},0);};
    b.onmouseenter=()=>{const s=ser[+b.dataset.i];const e=sh.bd.querySelector('.st-sel');e.querySelector('b').textContent=dayLbl(s.day,{weekday:'long'});e.querySelector('span').textContent=`${s.orders} ${plural(s.orders,['заказ','заказа','заказов'])} · ${money(s.revenue)} · ${s.views} ${plural(s.views,['просмотр','просмотра','просмотров'])}`;};});
  sh.bd.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openProduct(b.dataset.open));
}

/* Сертификат: статус берётся с сервера, одинаковый на всех устройствах */
async function syncCert(){
  if(!tg||!tg.initData||!tgUser)return;
  try{const r=await fetch('/api/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData})});const j=await r.json();
    if(j&&j.ok){S.isAdmin=!!j.isAdmin;S.cert.used=!!j.certUsed;S.cert.usedOn=j.order||'';LS.set('mf_cert_v1_'+UID,S.cert);}}catch(e){}
}

/* WELCOME */
function welcome(){
  if(S.cert.used||LS.get('mf_welcomed_'+UID,false))return;
  const sh=openSheet({title:'',body:`<div class="center"><div class="wel-art"><img alt="" src="uploads/logo-1788431556435-fupx.jpg"></div><div class="h1">${esc(tr('welT'))}</div><p class="lead">${esc(tr('welS'))}</p></div>`,
    foot:`<button class="btn full" id="welOk">${ic('gift')}${esc(tr('welB'))}</button><div style="text-align:center;margin-top:10px"><button class="link" id="welLater" style="color:var(--muted);font-weight:500;padding:8px">${esc(tr('later'))}</button></div>`,
    onClose:()=>save('wel',true)});
  sh.el.querySelector('#welOk').onclick=()=>{hap('ok');closeSheet();setTimeout(()=>go('profile'),250);};
  sh.el.querySelector('#welLater').onclick=()=>closeSheet();
}


/* лёгкий режим: слабые Android сразу, остальные — если прокрутка проседает */
(function perf(){
  const ua=navigator.userAgent||'';const root=document.documentElement;
  const forced=new URLSearchParams(location.search).get('lite');
  if(forced==='0'){root.classList.remove('lite');return;}
  if(forced==='1'||LS.get('mf_lite',false)){root.classList.add('lite');return;}
  const android=/Android/i.test(ua);
  const tgClass=(ua.match(/Telegram-Android\/[^(]*\([^)]*;\s*(LOW|AVERAGE|HIGH)\)/i)||[])[1];
  const mem=navigator.deviceMemory||8,cores=navigator.hardwareConcurrency||8;
  if(android&&(tgClass==='LOW'||(tgClass!=='HIGH'&&(mem<=4||cores<=4)))){root.classList.add('lite');return;}
  // замер плавности на первых прокрутках
  let frames=0,slow=0,last=0,watching=false,stopT;
  const tick=t=>{if(!watching)return;if(last){const d=t-last;frames++;if(d>28)slow++;}last=t;requestAnimationFrame(tick);};
  const onScroll=()=>{
    if(root.classList.contains('lite'))return;
    if(!watching){watching=true;last=0;requestAnimationFrame(tick);}
    clearTimeout(stopT);stopT=setTimeout(()=>{watching=false;
      if(frames>=40){ if(slow/frames>0.25){root.classList.add('lite');LS.set('mf_lite',true);removeEventListener('scroll',onScroll);} else if(frames>240){removeEventListener('scroll',onScroll);} }
    },400);
  };
  addEventListener('scroll',onScroll,{passive:true});
})();

/* BOOT */
(function boot(){
  if(tg){try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();
    if(/^(ios|android)$/.test(tg.platform||'')&&tg.isVersionAtLeast&&tg.isVersionAtLeast('8.0')&&tg.requestFullscreen)tg.requestFullscreen();
  }catch(e){}}
  document.documentElement.lang=S.lang==='ru'?'ru':'uz';
  applyTheme();renderTop();restoreAuction();renderNav();skeleton();
  loadAuction();
  {const sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'';if(location.hash==='#auction'||/^(auction|remind_|offer_)/.test(sp))go('auction');}
  const sync=Promise.all([pullCloud(),syncCert()]);
  const CACHE_K='mf_items_cache_v1';
  const cached=LS.get(CACHE_K,null);let booted=false;
  const fresh=fetch(BASE+'data.json',{cache:'no-cache'}).then(r=>r.json()).then(items=>{
    const s=JSON.stringify(items);
    if(booted&&cached&&JSON.stringify(cached)===s)return null;
    try{localStorage.setItem(CACHE_K,s)}catch(e){}
    if(booted){items.sort((x,y)=>(!x.photo)-(!y.photo));S.items=items;S.byId={};items.forEach(i=>S.byId[i.id]=i);renderChips();renderGrid(true);renderHero();return null;}
    return items;
  });
  if(cached)fresh.catch(()=>{});
  (cached?Promise.resolve(cached):fresh).then(async items=>{
    if(!items)return;booted=true;
    items.sort((x,y)=>(!x.photo)-(!y.photo));S.items=items;items.forEach(i=>S.byId[i.id]=i);S.loaded=true;
    Object.keys(S.cart).forEach(id=>{if(!S.byId[id])delete S.cart[id];});
    $('grid').innerHTML='';renderChips();renderGrid(true);renderHero();renderNav();setupInfinite();
    loadFeed();if(S.tab==='auction')renderAuction(true);
    netBar();flushOutbox(true);
    await sync;
    Object.keys(S.cart).forEach(id=>{if(!S.byId[id])delete S.cart[id];});
    applyTheme();refreshLang();if(S.tab==='profile')renderProfile();Object.keys(cardCache).forEach(updateCardAction);renderNav();renderHero();
    handleStart();
    setTimeout(welcome,500);
  }).catch(()=>{if(booted)return;$('grid').innerHTML='';$('catEmpty').innerHTML=`<div class="empty"><div class="ic">${ic('x')}</div><h3>Нет соединения</h3><p>Проверьте интернет и откройте каталог ещё раз.</p></div>`;});
})();
</script>
